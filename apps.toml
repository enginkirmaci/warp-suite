# warp-suite app manifest
#
# The apps live in this repo under apps/<name> (imported with git subtree;
# each keeps its own history). This file only carries the build knobs
# scripts/bundle-linux.sh and the release workflow use - the suite commit is
# the single provenance for every app.
#
# Per-app build knobs (all optional):
#   linux_build   extra args for `cargo build --release` (e.g. "-p warp-station")
#   linux_skip    true = Windows-only app; bundle-linux.sh skips it entirely
#                 (no Linux build, no REVISIONS.txt entry, no desktop entry)
#   icon_prefix   base name of packaging/linux/icons/<prefix>-*.png
#                 (defaults to the app name)
#   scalable_svg  app-relative path to a scalable icon, installed as
#                 hicolor/scalable/apps/<icon_prefix>.svg

[apps.warp-station]
linux_build = "-p warp-station"
icon_prefix = "warp-station"
scalable_svg = "crates/warp-station/assets/icons/logo.svg"
notes = """
Repository workbench (Rust/GPUI workspace: warp-station, warp-station-core).
AI surface drives warp-agent's loopback door (~/.warp-agent/ipc.port +
ipc.token, NDJSON: open-workspace, new-chat, run-prompt, models, status).
Linux deliverable: warp-station alone (the zone snapper has its own
warp-snapit app below).
"""

[apps.warp-agent]
icon_prefix = "warpagent"
scalable_svg = "packaging/linux/icons/warpagent.svg"
notes = """
Chat client over `opencode serve` (Rust/GPUI, single crate). Owns the
loopback door protocol Warp Station consumes. Changing door commands, the
ipc.port/ipc.token file names or their ~/.warp-agent location is a
cross-app contract change: update Warp Station in the same commit.
"""

[apps.warp-snapit]
linux_skip = true
notes = """
Rust port of the SnapIt zone snapper (Windows-only binary; engine is
cfg(windows)-gated, platform-neutral modules tested on Linux). Reads the
same ~/.warp/snapit settings/layouts Warp Station reads - the two share
the settings contract, the misspelled DeactivedScreens field included.
Warp Station's SnapIt.Executable default still names the retired
Tools.SnapIt.exe; point it at snapit.exe to run the Rust port. Suite
deliverable: a portable zip with snapit.exe + the default settings seed
(packaging/windows/build.ps1), no installer.
"""

[apps.warp-notes]
icon_prefix = "warpnotes"
scalable_svg = "packaging/linux/icons/warpnotes.svg"
notes = """
Per-repo markdown notes (Rust/GPUI, single crate) - the Notes window
Warp Station's notes toggle, tools menu and repo-row icons launch. Reads
the shared ~/.warp/notes store (one folder per repo; a legacy
~/.devtools/notes renames over on first run, whichever app starts first).
Launch contract: `warp-notes [--store <path>] [--repo <name>]
[--note <path>]` - Warp Station always passes --store (its
notes_store_path setting, default the shared root) so a customized path
follows; multi-instance is free, the window outlives Warp Station.
Missing binary = the notes surfaces fail with a toast.
"""

# The C#/.NET SnapIt repo (github.com/enginkirmaci/SnapIt) stays excluded:
# the Rust warp-snapit port above is the suite's zone snapper.
