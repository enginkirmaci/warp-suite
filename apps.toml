# warp-suite app manifest
#
# Each [apps.<name>] section pins one app repo to a ref (branch, tag or
# SHA). A suite deploy = update pins (scripts/set-pin.sh) -> tag/dispatch
# the suite-release workflow. The workflow resolves every ref to its commit
# SHA and records the resolved SHAs in the suite release notes, so every
# release stays reproducible even with symbolic refs like "main".
#
# App repos stay the source of truth and build/release on their own; this
# manifest only names the known-good combinations warp-suite deploys.
#
# Per-app build knobs used by scripts/bundle-linux.sh (all optional):
#   linux_build   extra args for `cargo build --release` (e.g. "-p devtools")
#   linux_skip    true = Windows-only app; bundle-linux.sh skips it entirely
#                 (no Linux build, no REVISIONS.txt entry, no desktop entry)
#   icon_prefix   base name of packaging/linux/icons/<prefix>-*.png
#                 (defaults to the app name)
#   scalable_svg  repo-relative path to a scalable icon, installed as
#                 hicolor/scalable/apps/<icon_prefix>.svg

[apps.devtools]
repo = "https://github.com/enginkirmaci/DevTools.git"
# main holds the C# project; the Rust/GPUI workspace ships on `rust`
ref = "rust"
linux_build = "-p devtools"
icon_prefix = "devtools"
scalable_svg = "crates/devtools/assets/icons/logo.svg"
notes = """
Repository workbench (Rust/GPUI workspace: devtools, devtools-core).
AI surface drives warp-agent's loopback door (~/.warp-agent/ipc.port +
ipc.token, NDJSON: open-workspace, new-chat, run-prompt, models, status).
Its Windows build (packaging/windows/build.ps1) also builds the vendored
Tools.SnapIt.exe companion from src/Tools.SnapIt - self-contained, the
SnapIt repo is not needed. Linux deliverable: devtools alone (the Rust
snapit port has its own warp-snapit app below).
"""

[apps.warp-agent]
repo = "https://github.com/enginkirmaci/warp-agent.git"
# main holds the Avalonia prototype; the GPUI app ships on `rust-gpui`
ref = "rust-gpui"
linux_build = ""
icon_prefix = "warpagent"
scalable_svg = "packaging/linux/icons/warpagent.svg"
notes = """
Chat client over `opencode serve` (Rust/GPUI, single crate). Owns the
loopback door protocol DevTools consumes. Changing door commands, the
ipc.port/ipc.token file names or their ~/.warp-agent location is a
cross-app contract change: update DevTools and re-pin both apps in the
same suite release.
"""

[apps.warp-snapit]
repo = "https://github.com/enginkirmaci/warp-snapit.git"
ref = "main"
linux_skip = true
notes = """
Rust port of the SnapIt zone snapper (Windows-only binary; engine is
cfg(windows)-gated, platform-neutral modules tested on Linux). Reads the
same ~/.devtools/snapit settings/layouts as DevTools' vendored .NET
Tools.SnapIt.exe companion - the two share the settings contract, the
misspelled DeactivedScreens field included. DevTools still launches the
.NET companion by default; point its SnapIt.Executable setting at
snapit.exe to run the Rust port. Suite deliverable: a portable zip with
snapit.exe + the default settings seed (packaging/windows/build.ps1), no
installer.
"""

[apps.warp-notes]
repo = "https://github.com/enginkirmaci/warp-notes.git"
ref = "main"
icon_prefix = "warpnotes"
scalable_svg = "packaging/linux/icons/warpnotes.svg"
notes = """
Per-repo markdown notes (Rust/GPUI, single crate) - the Notes window
DevTools' notes toggle, tools menu and repo-row icons launch. Reads the
shared ~/.warp/notes store (one folder per repo; a legacy ~/.devtools/notes
renames over on first run, whichever app starts first). Launch contract:
`warp-notes [--store <path>] [--repo <name>] [--note <path>]` - DevTools
always passes --store (its notes_store_path setting, default the shared
root) so a customized path follows; multi-instance is free, the window
outlives DevTools. Missing binary = the notes surfaces fail with a toast.
"""

# The C#/.NET SnapIt repo (github.com/enginkirmaci/SnapIt) stays excluded:
# the Rust warp-snapit port above is the suite's zone snapper, and DevTools'
# Windows build vendors the .NET companion it needs.
