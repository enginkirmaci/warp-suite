# The suite's pin table.
#
# Each app is released from its own repository and pinned here by tag. The kit
# line records the newest published kit tag; an app's Cargo.toml pins the tag it
# was built against (it may be older until that app needs new kit API), and
# warp-suite `[patch]`es that source to kits/ when the app is built through apps/.
#
# `version` names the combined suite release. It is deliberately independent of
# the kit and app versions.
[suite]
version = "0.2.121"

[kits]
tag = "kits-v0.2.112"

[apps.warp-station]
repo = "enginkirmaci/warp-station"
tag = "v0.1.96"

[apps.warp-agent]
repo = "enginkirmaci/warp-agent"
tag = "v0.1.42"

[apps.warp-notes]
repo = "enginkirmaci/warp-notes"
tag = "v0.1.4"

[apps.warp-pomodoro]
repo = "enginkirmaci/warp-pomodoro"
tag = "v0.2.4"

[apps.warp-snapit]
repo = "enginkirmaci/warp-snapit"
tag = "v0.1.4"
