[package]
name = "warpui-kit-core"
version = "0.1.0"
edition = "2024"
description = "Theme palette, bundled fonts, type scale and shared control helpers for the warpui-kit GPUI components"
license = "MIT"

[dependencies]
# gpui-pre: crates.io snapshots of zed's gpui, pinned to the exact rev
# gpui-kit 0.9 is built against these exact 0.3.11 snapshots. Bump together with gpui-kit.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui-kit = { version = "0.9" }
# the net-event pump (pump.rs): both store-driven apps fed it the same
# copy-pasted drain loop
async-channel = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
# `media`: attachment mime guesses and inline images from bytes. Feature-scoped
# so an app that draws no images does not pull the decoders in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }
smallvec = { version = "1", optional = true }

[features]
# the media helpers; on by default because every suite app draws images
default = ["media"]
media = ["dep:image", "dep:smallvec"]

[dev-dependencies]
# headless UI probes (tests/); feature-unifies with the normal gpui-kit dep
# only under `cargo test`
gpui-kit = { version = "0.9", features = ["test-support"] }
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
