[package]
name = "warpui-kit-core"
version.workspace = true
edition.workspace = true
description = "Theme palette, bundled fonts, type scale and shared control helpers for the warpui-kit GPUI components"
license = "MIT"
repository.workspace = true

[features]
# the media helpers; on by default because every suite app draws images
default = ["media"]
media = ["dep:image", "dep:smallvec"]

[dependencies]
# the headless platform halves (paths, atomic writes) with the gpui asset
# source off: the shared ~/.warp/ui.json and the suite layout live there
warpui-kit-platform = { workspace = true, default-features = false }

# the gpui stack, pinned at the workspace root
gpui = { workspace = true }
gpui-kit = { workspace = true }

# third-party
async-channel = { workspace = true }
futures-util = { workspace = true, default-features = false, features = ["std"] }
# `media`: attachment mime guesses and inline images from bytes. Feature-scoped
# so an app that draws no images does not pull the decoders in.
image = { workspace = true, optional = true }
serde_json = { workspace = true }
smallvec = { workspace = true, optional = true }
tracing = { workspace = true, default-features = false, features = ["std"] }

[dev-dependencies]
# headless UI probes (tests/); feature-unifies with the normal gpui-kit dep
# only under `cargo test`
gpui = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
