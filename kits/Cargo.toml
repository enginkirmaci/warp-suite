# The warpui-kit crates shared by the suite's apps.
#
# These are members of the suite workspace (see ../Cargo.toml), NOT a workspace
# of their own: that is what lets one gpui-pre compile serve every app, and it
# is why kits/Cargo.lock no longer exists (the suite lock covers it).
#
# From this directory (cargo walks up to ../Cargo.toml):
#   cargo test  -p warpui-kit-core -p warpui-kit-diff -p warpui-kit-markdown -p warpui-kit-picker
#   cargo fmt --all --check
#   cargo clippy --all-targets -- -D warnings
