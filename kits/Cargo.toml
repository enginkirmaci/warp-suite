# The warpui-kit crates shared by the suite's apps.
#
# The apps under apps/ depend on them as path deps (../../kits/warpui-kit-*),
# so a suite release builds from this repo alone and the suite commit is the
# kits' provenance.
#
#   cargo test          # all four crates, headless GPUI probes included
#   cargo fmt --check
#   cargo clippy --all-targets

[workspace]
resolver = "3"
members = [
    "warpui-kit-core",
    "warpui-kit-diff",
    "warpui-kit-markdown",
    "warpui-kit-picker",
]

# The apps build these crates through their own workspace profiles, so this
# only shapes standalone cargo runs in kits/ (tests, clippy, a manual build).
[profile.release]
lto = "thin"
strip = true
codegen-units = 1
