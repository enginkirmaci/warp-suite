[package]
name = "warpui-kit-markdown"
version.workspace = true
edition.workspace = true
description = "Obsidian-style live markdown engine for gpui-kit editors: span parser, editor highlighter and formatting ops"
license = "MIT"
repository.workspace = true

[features]
# renders ```mermaid blocks as diagrams; without it they stay code blocks
mermaid = ["dep:merman", "dep:serde_json"]
# forwarded to the code-block highlighter — enable the languages notes show
tree-sitter-bash = ["warpui-kit-diff/tree-sitter-bash"]
tree-sitter-c = ["warpui-kit-diff/tree-sitter-c"]
tree-sitter-cpp = ["warpui-kit-diff/tree-sitter-cpp"]
tree-sitter-css = ["warpui-kit-diff/tree-sitter-css"]
tree-sitter-go = ["warpui-kit-diff/tree-sitter-go"]
tree-sitter-html = ["warpui-kit-diff/tree-sitter-html"]
tree-sitter-javascript = ["warpui-kit-diff/tree-sitter-javascript"]
tree-sitter-python = ["warpui-kit-diff/tree-sitter-python"]
tree-sitter-rust = ["warpui-kit-diff/tree-sitter-rust"]
tree-sitter-toml = ["warpui-kit-diff/tree-sitter-toml"]
tree-sitter-tsx = ["warpui-kit-diff/tree-sitter-tsx"]
tree-sitter-typescript = ["warpui-kit-diff/tree-sitter-typescript"]
tree-sitter-yaml = ["warpui-kit-diff/tree-sitter-yaml"]
all-languages = ["warpui-kit-diff/tree-sitter-bash", "warpui-kit-diff/tree-sitter-c", "warpui-kit-diff/tree-sitter-cpp", "warpui-kit-diff/tree-sitter-css", "warpui-kit-diff/tree-sitter-go", "warpui-kit-diff/tree-sitter-html", "warpui-kit-diff/tree-sitter-javascript", "warpui-kit-diff/tree-sitter-python", "warpui-kit-diff/tree-sitter-rust", "warpui-kit-diff/tree-sitter-toml", "warpui-kit-diff/tree-sitter-tsx", "warpui-kit-diff/tree-sitter-typescript", "warpui-kit-diff/tree-sitter-yaml"]

[dependencies]
warpui-kit-core = { workspace = true }
warpui-kit-diff = { workspace = true }

# the gpui stack, pinned at the workspace root
gpui = { workspace = true }
gpui-kit = { workspace = true }

anyhow = { workspace = true }
log = "0.4"
# leaves out the default ELK layout, which is EPL-2.0, and math labels
merman = { version = "0.9", default-features = false, features = ["svg", "layout-cytoscape", "all-diagrams"], optional = true }
serde_json = { workspace = true, optional = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
# headless UI probes (tests/); feature-unifies with the normal gpui-kit dep
# only under `cargo test`
gpui = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
