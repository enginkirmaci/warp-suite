[package]
name = "warpui-kit-picker"
version.workspace = true
edition.workspace = true
description = "Filtered select-style picker for gpui-kit applications: trigger, filter input, virtualized rows and overlay popups"
license = "MIT"
repository.workspace = true

[dependencies]
warpui-kit-core = { workspace = true }

# the gpui stack, pinned at the workspace root
gpui = { workspace = true }
gpui-kit = { workspace = true }

[dev-dependencies]
# headless probes (tests/); feature-unifies with the normal gpui-kit dep
# only under `cargo test`
gpui-kit = { workspace = true, features = ["test-support"] }
