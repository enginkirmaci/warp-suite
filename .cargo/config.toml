# One cargo target directory for the whole suite.
#
# Cargo resolves build.target-dir relative to the directory holding this file,
# so every app under apps/<app> (and warpui-kits) builds into
# warp-suite/.build/target no matter which directory cargo is invoked from.
# That is also the path scripts/bundle-linux.sh uses (it exports
# CARGO_TARGET_DIR), so debug builds and release bundles share one tree and
# the GPUI dependency graph is compiled once instead of once per app.
#
# Precedence: an environment CARGO_TARGET_DIR wins, and a .cargo/config.toml
# closer to the working directory (e.g. apps/<app>/.cargo/) wins over this one.
[build]
target-dir = ".build/target"
