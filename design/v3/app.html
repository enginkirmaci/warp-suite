  --line-soft: #2A2F38; --line: #363C47; --line-strong: #49505C;
  --text: #F0F4FB; --text-2: #C9D2E0; --text-3: #9FA9B8;
  --accent: #5B9DF5; --accent-hover: #77B0F8; --on-accent: #0A1626;
  --accent-ink: #8FBBFA; --accent-soft: #1E2F4A;
}

:root {
  /* entity hues: one meaning each, the same in every palette and app */
  --branch: #6ED0BE; --changes: #F2BC5B; --pr: #BCA6F7; --issue: #F795AE;
  --behind: #86C8F2; --ahead: #A3D977; --ok: #7FD69B; --danger: #F88C86;
  --add-bg: rgba(127, 214, 155, .13); --del-bg: rgba(248, 140, 134, .13);

  --sans: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
  --r-s: 6px; --r-m: 8px;
  --rail: 76px; --list: 432px;
  /* motion: opacity and transform only, so GPUI can draw all of it */
  --t-fast: .12s; --t-base: .18s; --ease: cubic-bezier(.2, 0, 0, 1);
}
[data-type="plex"] { --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", monospace; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--chrome); color: var(--text);
  font: 400 14px/20px var(--sans);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
svg.i { display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
svg.i.fill { fill: currentColor; }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 1px; }

/* type: twelve is the floor */
.t-title { font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -.01em; }
.t-list-title { font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -.01em; }
.t-section { font-size: 16px; line-height: 22px; font-weight: 600; }
.t-name { font-size: 15px; line-height: 20px; font-weight: 600; }
.t-body { font-size: 14px; line-height: 20px; }
.t-meta { font-size: 13px; line-height: 18px; color: var(--text-2); }
.t-caption { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-3); }
.t-mono { font-family: var(--mono); font-size: 13px; line-height: 18px; }
.dim { color: var(--text-2); } .faint { color: var(--text-3); }
.grow { flex: 1; min-width: 0; }
.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 34px; padding: 0 12px; border-radius: var(--r-s);
  border: 1px solid var(--line-strong); background: var(--panel);
  font-size: 14px; font-weight: 500; white-space: nowrap; flex: none;
}
.btn:hover { background: var(--raised); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { background: none; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--raised); color: var(--text); }
.btn.icon { width: 34px; padding: 0; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn { transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast) var(--ease); }
.btn:active:not([disabled]) { transform: scale(.97); }
.btn.busy[disabled] { opacity: 1; cursor: progress; }
.btn.done svg { color: var(--ok); animation: pop .24s var(--ease); }
.btn.primary.done svg { color: inherit; }
.btn .split { margin: 0 -12px 0 4px; width: 30px; height: 100%; display: grid; place-items: center; border-left: 1px solid rgba(0, 0, 0, .22); }
.link { color: var(--accent-ink); font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
.link:hover { text-decoration: underline; }
.link[disabled] { opacity: .45; cursor: default; text-decoration: none; }
span.link { cursor: progress; }
span.link:hover { text-decoration: none; }

/* entity stats: icon + number + word, always in that entity's hue */
.stat { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; line-height: 18px; font-weight: 500; white-space: nowrap; }
.stat.branch { color: var(--branch); font-family: var(--mono); font-weight: 400; min-width: 0; }
.stat.branch span { overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
.stat.ok span { color: var(--text-3); font-weight: 400; }
.stat.changes { color: var(--changes); } .stat.pr { color: var(--pr); } .stat.issue { color: var(--issue); }
.stat.behind { color: var(--behind); } .stat.ahead { color: var(--ahead); } .stat.ok { color: var(--ok); }
.stat.danger { color: var(--danger); } .stat.mute { color: var(--text-3); }
.stats { display: flex; align-items: center; gap: 12px; min-width: 0; }

/* filter strip */
.filters { display: flex; gap: 2px; padding: 3px; background: var(--well); border-radius: var(--r-m); }
.filter { display: inline-flex; gap: 5px; align-items: baseline; height: 30px; padding: 5px 7px; border-radius: var(--r-s); font-size: 13px; line-height: 20px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
.filter b { font-weight: 500; color: var(--text-3); }
.filter:hover { color: var(--text); }
.filter.on { background: var(--raised); color: var(--text); font-weight: 600; }
.filter.on b { color: var(--accent-ink); font-weight: 600; }

/* fields */
.field { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border-radius: var(--r-s); background: var(--well); border: 1px solid var(--line); color: var(--text-3); }
.field:focus-within { border-color: var(--accent-ink); }
.field input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font-size: 14px; }
.field input::placeholder, textarea::placeholder { color: var(--text-3); }
textarea.area { width: 100%; resize: none; background: var(--well); border: 1px solid var(--line); border-radius: var(--r-s); padding: 9px 10px; outline: 0; font-size: 14px; line-height: 20px; }
textarea.area:focus { border-color: var(--accent-ink); }
.kbd { font: 500 12px/18px var(--mono); padding: 0 5px; border-radius: 4px; border: 1px solid var(--line-strong); color: var(--text-2); }

/* switch and segmented */
.switch { width: 36px; height: 20px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line-strong); position: relative; flex: none; }
.switch { transition: background var(--t-base), border-color var(--t-base); }
.switch::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--text-2); transition: transform var(--t-base) var(--ease), background var(--t-base); }
.switch.on { background: var(--accent); border-color: var(--accent); }
.switch.on::after { transform: translateX(16px); background: var(--on-accent); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--r-m); background: var(--well); }
.seg button { height: 28px; padding: 0 12px; border-radius: var(--r-s); font-size: 13px; font-weight: 500; color: var(--text-2); }
.seg button.on { background: var(--raised); color: var(--text); font-weight: 600; }

/* window */
.window { display: flex; flex-direction: column; flex: 1; min-height: 0; background: var(--base); }
.titlebar { height: 46px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px; background: var(--chrome); border-bottom: 1px solid var(--line); }
.mark { width: 28px; height: 28px; border-radius: var(--r-s); background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.titlebar .name { font-size: 15px; font-weight: 600; white-space: nowrap; }
.titlebar .field { width: min(460px, 36vw); height: 32px; margin: 0 auto; }
.titlebar .activity { margin-left: -4px; }
.winbtn { width: 34px; height: 32px; display: grid; place-items: center; border-radius: var(--r-s); color: var(--text-2); }
.winbtn:hover { background: var(--raised); color: var(--text); }
/* the family: the linked apps sit right after the app's own mark and name,
   behind one separator, so the suite reads as one group */
.applinks { display: flex; align-items: center; gap: 2px; margin-left: 4px; padding-left: 8px; border-left: 1px solid var(--line); }
.applink { width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--r-s); color: var(--text-2); flex: none; }
.applink:hover { background: var(--raised); color: var(--text); }
.shell { flex: 1; min-height: 0; display: flex; }
.stage { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.panes { flex: 1; min-height: 0; display: flex; }

/* repo tabs: above list and detail; the first tab is the list itself and cannot close */
.tabstrip { height: 40px; flex: none; display: flex; align-items: flex-end; gap: 2px; padding: 0 8px; background: var(--chrome); border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tabstrip[hidden] { display: none; }
.wtab { position: relative; display: flex; align-items: center; gap: 8px; height: 35px; min-width: 120px; max-width: 240px; flex: 0 1 auto; margin-bottom: -1px; padding: 0 6px 0 12px; border: 1px solid transparent; border-bottom: 0; border-radius: var(--r-s) var(--r-s) 0 0; color: var(--text-2); font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.wtab:hover { background: var(--panel); color: var(--text); }
.wtab.on { background: var(--panel); border-color: var(--line); color: var(--text); font-weight: 600; height: 36px; }
.wtab.on::before { content: ""; position: absolute; left: -1px; right: -1px; top: -1px; height: 2px; background: var(--accent); border-radius: 2px 2px 0 0; }
.wtab.home { flex: none; min-width: 0; padding-right: 12px; }
.wtab.home.on { background: var(--base); }
.wtab .clip { flex: 0 1 auto; }
.wtab .stat { font-size: 13px; }
.wtab-x { width: 22px; height: 22px; margin-left: auto; display: grid; place-items: center; border-radius: 4px; color: var(--text-3); flex: none; visibility: hidden; }
.wtab:hover .wtab-x, .wtab.on .wtab-x, .wtab-x:focus-visible { visibility: visible; }
.wtab-x:hover { background: var(--raised); color: var(--text); }

/* rail: the app's sections, nothing else */
.rail { width: var(--rail); flex: none; display: flex; flex-direction: column; gap: 4px; padding: 10px 8px; background: var(--chrome); border-right: 1px solid var(--line); }
.rail .spacer { flex: 1; }
.rail-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0 6px; border-radius: var(--r-m); color: var(--text-3); font-size: 12px; line-height: 16px; font-weight: 500; position: relative; width: 100%; }
.rail-item:hover { background: var(--panel); color: var(--text); }
.rail-item.on { background: var(--raised); color: var(--text); }
.rail-item.on svg { color: var(--accent-ink); }
.rail-item .pip { position: absolute; top: 6px; right: 13px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-size: 12px; line-height: 16px; font-weight: 600; text-align: center; }

/* list pane */
.list { width: var(--list); flex: none; display: flex; flex-direction: column; min-height: 0; background: var(--base); border-right: 1px solid var(--line); }
.shell.focus .list, .shell.in-tab .list { display: none; }
@media (max-width: 1180px) { .shell.wide-tab .list { display: none; } }
.list-head { position: relative; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); flex: none; }
.list-head .progress { position: absolute; left: 0; right: 0; bottom: -1px; }
.list-title { display: flex; align-items: center; gap: 4px; min-height: 30px; }
.list-title .t-list-title { flex: 1; min-width: 0; }
.list-title .btn.icon { width: 30px; height: 30px; }
.list-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0 12px; }
.group { display: flex; align-items: center; gap: 8px; width: 100%; height: 34px; padding: 0 16px; font-size: 13px; font-weight: 600; color: var(--text-2); text-align: left; }
.group:hover { color: var(--text); }
.group em { font-style: normal; font-weight: 500; color: var(--text-3); }
.row { display: block; width: 100%; text-align: left; padding: 10px 16px 10px 13px; border-left: 3px solid transparent; transition: background var(--t-fast); }
.row:hover { background: var(--panel); }
.row.pending { color: var(--text-2); cursor: progress; animation: rise var(--t-base) var(--ease); }
.row.pending:hover { background: none; }
.busy-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--behind); white-space: nowrap; }
.row.on { background: var(--raised); border-left-color: var(--accent); }
.row-top { display: flex; align-items: center; gap: 8px; min-height: 22px; }
.row-sub { display: flex; align-items: center; gap: 8px; margin-top: 3px; min-height: 18px; color: var(--text-2); font-size: 13px; line-height: 18px; }
.row .when { font-size: 13px; color: var(--text-3); }
.row .hover-only { display: none; }
.row:hover .hover-only { display: grid; }
.row:hover .when { display: none; }
.rowtab { color: var(--accent-ink); }
.starbtn { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 4px; color: var(--text-3); flex: none; }
.starbtn:hover { color: var(--text); background: var(--overlay); }
.starbtn.on { color: var(--accent-ink); }
.rowact { width: 26px; height: 22px; place-items: center; border-radius: 4px; color: var(--text-2); }
.rowact:hover { background: var(--overlay); color: var(--text); }

/* detail pane */
.detail { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.detail-head { flex: none; padding: 16px 24px 0; }
.detail-title { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.detail-title .t-title { min-width: 0; }
.detail-sub { display: flex; align-items: center; gap: 14px; margin-top: 4px; flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; margin: 12px -8px 0; overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 12px; font-size: 14px; font-weight: 500; color: var(--text-2); border-radius: var(--r-s) var(--r-s) 0 0; white-space: nowrap; }
.tab:hover { color: var(--text); background: var(--raised); }
.tab.on { color: var(--text); font-weight: 600; }
.tab.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: var(--accent); }
.tab .n { font-size: 13px; font-weight: 500; color: var(--text-3); }
.tab.on .n { color: var(--text-2); }
.tab-rule { position: relative; height: 1px; background: var(--line); flex: none; }
.tab-rule .progress { position: absolute; left: 0; right: 0; top: -1px; }
.detail-body { flex: 1; min-height: 0; overflow-y: auto; }
.pad { padding: 20px 24px 28px; }
.measure { max-width: 760px; }
.columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; max-width: 1180px; }
.card { background: var(--base); border: 1px solid var(--line); border-radius: var(--r-m); }
.card-head { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-bottom: 1px solid var(--line-soft); }
.card-head .t-section { flex: 1; font-size: 15px; }
.card-body { padding: 8px 16px 12px; }
.kv { display: flex; align-items: center; gap: 12px; min-height: 34px; }
.kv > :first-child { width: 112px; flex: none; color: var(--text-2); font-size: 13px; }
.item { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line-soft); }
.item:first-child { border-top: 0; }
.item > svg { margin-top: 2px; }
.launch { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.launch .btn { justify-content: flex-start; }
.tag { display: inline-flex; height: 24px; align-items: center; padding: 0 8px; border-radius: 12px; background: var(--raised); color: var(--text-2); font-size: 13px; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 100%; min-height: 220px; color: var(--text-2); text-align: center; padding: 24px; }

/* pull request: the same detail pane, a status strip instead of tabs */
.item.open { cursor: pointer; border-radius: var(--r-s); transition: background var(--t-fast); }
.item.open:hover { background: var(--raised); }
.pr-back { margin-left: -8px; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px 0 7px; border-radius: 12px; background: rgba(188, 166, 247, .14); color: var(--pr); font-size: 13px; font-weight: 600; flex: none; }
.avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--raised); color: var(--text-2); font-size: 12px; line-height: 1; font-weight: 600; }
.avatar.s { width: 24px; height: 24px; }
.pr-sub { gap: 10px 12px; font-size: 13px; line-height: 18px; color: var(--text); }
.pr-lines { display: inline-flex; gap: 6px; }
.pr-lines .num-add, .pr-lines .num-del { font-size: 13px; }
.pr-status { flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 20px; min-height: 44px; padding: 6px 24px; background: var(--base); color: var(--text-2); font-size: 13px; line-height: 18px; }
.pr-person { display: inline-flex; align-items: center; gap: 7px; }
.thread { max-width: 920px; display: flex; flex-direction: column; gap: 16px; }
.comment { display: flex; gap: 12px; align-items: flex-start; }
.comment .card { min-width: 0; }
.comment-body { padding: 12px 16px 2px; font-size: 14px; line-height: 22px; }
.comment-body p { margin: 0 0 10px; }
.comment-body b { font-weight: 600; }
.comment-body code { font: 400 13px var(--mono); background: var(--well); padding: 1px 5px; border-radius: 4px; }
.check-card { margin-left: 44px; }
.check-card .card-head h3 { flex: 1; }
.check-row { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 16px; border-top: 1px solid var(--line-soft); }
.check-card .card-head + .check-row { border-top: 0; }
.check-row.failed { background: var(--del-bg); }

/* changes: file column + diff, both inside the tab */
.ch-layout { display: flex; height: 100%; min-height: 0; }
.ch-files { width: 320px; flex: none; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--base); }
.ch-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0; }
.file { display: flex; align-items: center; gap: 8px; width: 100%; height: 34px; padding: 0 8px 0 13px; border-left: 3px solid transparent; font-size: 13px; text-align: left; cursor: pointer; }
.file .acts { display: none; gap: 2px; flex: none; }
.file:hover .acts, .file .acts.armed { display: flex; }
.file:hover .nums, .file .acts.armed ~ .nums { display: none; }
.file .nums { display: flex; gap: 6px; flex: none; }
.file .acts button { min-width: 24px; height: 24px; display: grid; place-items: center; border-radius: 4px; color: var(--text-2); }
.file .acts button:hover { background: var(--overlay); color: var(--text); }
.file .acts button.armed { color: var(--danger); padding: 0 6px; font-size: 13px; font-weight: 500; }
.ch-group { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 16px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.ch-group em { font-style: normal; font-weight: 500; color: var(--text-3); }
.ch-group .link { margin-left: auto; font-size: 13px; }
.file:hover { background: var(--panel); }
.file.on { background: var(--raised); border-left-color: var(--accent); }
.file .st { width: 14px; font: 500 13px var(--mono); flex: none; }
.st.M { color: var(--changes); } .st.A { color: var(--ok); } .st.D { color: var(--danger); }
.file .dir { color: var(--text-3); }
.num-add { color: var(--ok); font: 500 12px var(--mono); } .num-del { color: var(--danger); font: 500 12px var(--mono); }
.ch-commit { flex: none; padding: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.ch-commit .btn { width: 100%; }
.ch-diff { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; background: var(--well); }
.diff-head { display: flex; align-items: center; gap: 12px; height: 44px; flex: none; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.diff-scroll { flex: 1; min-height: 0; overflow: auto; padding-bottom: 12px; }
.hunk { font: 500 13px/28px var(--mono); padding: 0 16px; color: var(--behind); background: var(--base); position: sticky; left: 0; }
.dl { display: flex; font: 400 13px/21px var(--mono); white-space: pre; min-width: max-content; }
.dl .no { width: 48px; flex: none; padding-right: 10px; text-align: right; color: var(--text-3); user-select: none; }
.dl .sg { width: 18px; flex: none; color: var(--text-3); }
.dl.add { background: var(--add-bg); } .dl.add .sg { color: var(--ok); }
.dl.del { background: var(--del-bg); } .dl.del .sg { color: var(--danger); }
.toolbar { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
.toolbar .field { flex: 1; min-width: 160px; max-width: 360px; height: 34px; }
.menu-wrap { position: relative; flex: none; display: inline-flex; }
.sort { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px; border-radius: var(--r-s); font-size: 13px; color: var(--text-2); white-space: nowrap; }
.sort b { font-weight: 500; color: var(--text); }
.sort:hover { background: var(--raised); }
.menu { position: absolute; top: 38px; left: 0; z-index: 10; min-width: 190px; padding: 4px; background: var(--overlay); border: 1px solid var(--line-strong); border-radius: var(--r-m); box-shadow: 0 8px 24px rgba(0, 0, 0, .4); animation: rise var(--t-fast) var(--ease); }
.menu button { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 10px 0 8px; border-radius: var(--r-s); font-size: 14px; text-align: left; white-space: nowrap; }
.menu button:hover { background: var(--line-strong); }
.menu > button svg { color: var(--text-2); }
.menu > button[aria-checked="true"] svg { color: var(--accent-ink); }
.menu .tick { width: 16px; flex: none; }
.menu.right { left: auto; right: 0; }
.menu.wide { width: 320px; }
.menu .kbd { margin-left: auto; }
.menu hr { border: 0; height: 1px; background: var(--line-strong); margin: 4px 0; }
.menu > button.danger, .menu > button.danger svg { color: var(--danger); }
.menu .field { height: 32px; margin: 2px 2px 6px; background: var(--base); }
.menu .label { padding: 6px 8px 2px; font-size: 13px; color: var(--text-3); }
.menu .scroll-y { max-height: 240px; overflow-y: auto; }
.branch-row { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 8px; border-radius: var(--r-s); font-size: 13px; font-family: var(--mono); cursor: pointer; }
.branch-row:hover { background: var(--line-strong); }
.branch-row .tick, .branch-row > svg { color: var(--accent-ink); flex: none; }
.branch-row .x { width: 24px; height: 24px; display: none; place-items: center; border-radius: 4px; color: var(--text-2); margin-left: auto; }
.branch-row:hover .x { display: grid; }
.branch-row .x:hover { color: var(--danger); background: var(--overlay); }
.branch-row .x.armed { display: inline-flex; width: auto; padding: 0 6px; color: var(--danger); font: 500 13px var(--sans); }
.split-btn { display: inline-flex; flex: none; }
.split-btn > .btn:first-child { border-radius: var(--r-s) 0 0 var(--r-s); border-right-width: 0; }
.split-btn .menu-wrap > .btn { width: 30px; padding: 0; border-radius: 0 var(--r-s) var(--r-s) 0; }
.split-btn .btn.primary + .menu-wrap > .btn { border-left: 1px solid rgba(0, 0, 0, .22); }
.branch-pick { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: var(--r-s); background: var(--well); border: 1px solid var(--line); color: var(--branch); font: 400 13px var(--mono); }

/* list tools */
.list-tools { display: flex; align-items: center; gap: 6px; min-height: 26px; margin: -2px 0 -4px; }
.list-tools .sort { height: 26px; }
.list-tools .tag { height: 22px; cursor: pointer; }
.list-tools .tag.on { background: var(--accent-soft); color: var(--accent-ink); }
.group .solo { display: none; margin-left: auto; color: var(--text-3); }
.group:hover .solo { display: grid; }
.group .solo:hover { color: var(--text); }

/* global search */
.search-pop { position: absolute; top: 38px; left: 0; right: 0; z-index: 15; max-height: min(460px, 70vh); overflow-y: auto; padding: 4px; color: var(--text); background: var(--overlay); border: 1px solid var(--line-strong); border-radius: var(--r-m); box-shadow: 0 16px 40px rgba(0, 0, 0, .45); }
.titlebar .field { position: relative; }
.search-state { display: flex; align-items: center; gap: 8px; padding: 12px; color: var(--text-2); font-size: 13px; }
.hit-group { padding: 8px 8px 4px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.hit { display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 7px 8px; border-radius: var(--r-s); text-align: left; }
.hit:hover { background: var(--line-strong); }
.hit > svg { margin-top: 2px; color: var(--text-2); }
.hit .t-mono { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
.hit mark { background: var(--accent-soft); color: var(--accent-ink); border-radius: 2px; }

/* history */
.commit { display: block; width: 100%; padding: 8px 12px 8px 13px; border-left: 3px solid transparent; text-align: left; }
.commit:hover { background: var(--panel); }
.commit.on { background: var(--raised); border-left-color: var(--accent); }
.commit .subject { display: block; font-size: 14px; line-height: 20px; font-weight: 500; }
.commit-meta { display: flex; align-items: center; gap: 8px; margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--text-2); }
.day { padding: 12px 16px 4px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.commit-head { flex: none; padding: 14px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.commit-head .t-section { margin-bottom: 4px; }
.commit-acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.file-strip { display: flex; gap: 6px; overflow-x: auto; flex: none; padding: 8px 16px; background: var(--base); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.file-strip button { height: 28px; padding: 0 8px; flex: none; border-radius: var(--r-s); font: 400 13px var(--mono); color: var(--text-2); }
.file-strip button:hover { background: var(--raised); }
.file-strip button.on { background: var(--raised); color: var(--text); }

/* run rows: pipelines, activity */
.run { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 16px; border-top: 1px solid var(--line-soft); }
.card-head + .run { border-top: 0; }
.run.failed { background: var(--del-bg); }
.log { font: 400 13px/21px var(--mono); color: var(--text-2); padding: 10px 16px; background: var(--well); border-radius: 0 0 var(--r-m) var(--r-m); max-height: 240px; overflow-y: auto; white-space: pre-wrap; }
.log b { color: var(--ok); font-weight: 400; }

/* forms */
.form { display: flex; flex-direction: column; gap: 12px; }
.form label > span { display: block; margin-bottom: 5px; font-size: 13px; color: var(--text-2); }
.form label > span.inline, .form label > span.field { display: flex; margin-bottom: 0; color: var(--text-3); }
.form label > span.inline .field { display: flex; }
.inline { display: flex; gap: 8px; align-items: center; }
.inline .field { flex: 1; min-width: 0; }
.field.text input { font-family: var(--mono); font-size: 13px; }
.setting .field { width: 340px; max-width: 46%; flex: none; }
.setting.stack { flex-direction: column; align-items: stretch; gap: 8px; }
.setting.stack .field, .setting.stack .area { width: 100%; max-width: none; }
.form-error { font-size: 13px; color: var(--danger); }
.stepper { display: inline-flex; align-items: center; gap: 2px; }
.stepper b { width: 28px; text-align: center; font-weight: 600; }
.found { max-height: 220px; overflow-y: auto; border: 1px solid var(--line-strong); border-radius: var(--r-s); background: var(--base); }
.found button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 38px; padding: 4px 10px; text-align: left; border-top: 1px solid var(--line-soft); }
.found button:first-child { border-top: 0; }
.box { width: 18px; height: 18px; flex: none; display: grid; place-items: center; border-radius: 4px; border: 1px solid var(--line-strong); background: var(--well); color: var(--on-accent); }
.box.on { background: var(--accent); border-color: var(--accent); }
.note-tag { display: inline-flex; height: 22px; align-items: center; padding: 0 8px; border-radius: 11px; background: var(--accent-soft); color: var(--accent-ink); font-size: 12px; font-weight: 500; }
.tool-state { display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
.dot.on { background: var(--ok); }

/* notes editor */
.fmtbar { flex: none; display: flex; align-items: center; gap: 2px; min-height: 42px; padding: 4px 16px; background: var(--base); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.fmtbar button { min-width: 30px; height: 30px; padding: 0 6px; flex: none; display: grid; place-items: center; border-radius: var(--r-s); font-size: 13px; font-weight: 600; color: var(--text-2); }
.fmtbar button:hover { background: var(--raised); color: var(--text); }
.fmtbar i { width: 1px; height: 18px; background: var(--line); margin: 0 6px; flex: none; }
.statusline { flex: none; display: flex; gap: 14px; min-height: 30px; align-items: center; padding: 0 24px; background: var(--base); border-top: 1px solid var(--line); font-size: 13px; color: var(--text-3); }

/* chat extras */
.ask { max-width: 760px; border: 1px solid var(--changes); border-radius: var(--r-m); background: var(--base); padding: 12px 14px; }
.ask .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.queue { flex: none; padding: 8px 24px 0; }
.queued { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 4px 6px 4px 12px; border-radius: var(--r-s); background: var(--base); border: 1px solid var(--line); font-size: 13px; }
.composer-wrap { flex: none; border-top: 1px solid var(--line); margin-top: 8px; padding: 12px 24px 12px; }
.composer-row { display: flex; align-items: flex-end; gap: 8px; }
.composer-opts { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.pillbtn { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 13px; background: var(--base); border: 1px solid var(--line); color: var(--text-2); font-size: 13px; }
.pillbtn:hover { color: var(--text); background: var(--raised); }

/* markdown reading */
.prose { font-size: 15px; line-height: 25px; color: var(--text); }
.prose h1 { font-size: 26px; line-height: 34px; font-weight: 600; margin: 0 0 12px; letter-spacing: -.01em; }
.prose h2 { font-size: 19px; line-height: 26px; font-weight: 600; margin: 26px 0 8px; }
.prose p { margin: 0 0 12px; color: var(--text); }
.prose ul { margin: 0 0 12px; padding-left: 22px; }
.prose code { font: 400 13px var(--mono); background: var(--well); padding: 2px 5px; border-radius: 4px; }
.prose pre { font: 400 13px/21px var(--mono); background: var(--well); padding: 12px 14px; border-radius: var(--r-m); overflow-x: auto; margin: 0 0 14px; }

/* settings form */
.setting { display: flex; align-items: center; gap: 24px; min-height: 60px; padding: 10px 0; border-top: 1px solid var(--line-soft); }
.setting:first-of-type { border-top: 0; }
.setting .grow > div:last-child:not(:first-child) { font-size: 13px; line-height: 18px; color: var(--text-2); margin-top: 2px; }

/* chat */
.chat { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.chat-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
.bubble { max-width: 760px; }
.bubble.me { align-self: flex-end; background: var(--raised); padding: 10px 14px; border-radius: var(--r-m); }
.bubble .who { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
.perm { max-width: 760px; border: 1px solid var(--changes); border-radius: var(--r-m); background: var(--base); padding: 12px 14px; }
.composer { flex: none; padding: 12px 24px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: flex-end; }

/* snapit zones */
.zones { aspect-ratio: 16 / 9; max-width: 860px; background: var(--well); border: 1px solid var(--line); border-radius: var(--r-m); padding: 8px; display: grid; gap: 8px; }
.zone { background: var(--raised); border: 1px solid var(--line-strong); border-radius: var(--r-s); display: grid; place-items: center; font-size: 22px; font-weight: 600; color: var(--text-2); }
.zone.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.thumb { width: 64px; height: 36px; flex: none; display: grid; gap: 2px; padding: 2px; background: var(--well); border: 1px solid var(--line); border-radius: 4px; }
.thumb i { background: var(--line-strong); border-radius: 1px; }

/* dialog: the only overlay in the suite */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); display: grid; place-items: center; z-index: 20; }
.dialog { width: 440px; max-width: calc(100vw - 32px); background: var(--overlay); border: 1px solid var(--line-strong); border-radius: 10px; padding: 20px; box-shadow: 0 16px 40px rgba(0, 0, 0, .45); }
.toasts { position: fixed; bottom: 16px; right: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; z-index: 30; max-width: 420px; }
.toast { background: var(--overlay); border: 1px solid var(--line-strong); border-radius: var(--r-m); padding: 9px 14px; font-size: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); display: flex; gap: 8px; align-items: center; animation: rise var(--t-base) var(--ease); }
.toast { pointer-events: auto; }
.toast svg { color: var(--ok); flex: none; }
.toast.info svg { color: var(--behind); }
.toast.error { border-color: var(--danger); }
.toast.error svg { color: var(--danger); }
.toast button { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 4px; margin-right: -6px; }
.toast button svg { color: var(--text-2); }
.toast button:hover { background: var(--raised); }
.toast.out { opacity: 0; transition: opacity var(--t-base); }

/* waiting */
.spinning { display: inline-grid; place-items: center; flex: none; animation: spin .8s linear infinite; }
.progress { height: 2px; overflow: hidden; }
.progress::after { content: ""; display: block; width: 32%; height: 100%; background: var(--accent); border-radius: 1px; animation: slide 1.2s cubic-bezier(.4, 0, .2, 1) infinite; }
.activity { display: inline-flex; align-items: center; gap: 7px; max-width: 220px; height: 28px; padding: 0 10px; border-radius: 14px; background: var(--panel); color: var(--behind); font-size: 13px; font-weight: 500; white-space: nowrap; }
.activity.pop { animation: rise var(--t-base) var(--ease); }
.dots { display: flex; gap: 5px; height: 20px; align-items: center; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); animation: dot 1.2s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }

/* entrances: played once, only when the view changes */
.detail.enter .detail-body > * { animation: rise var(--t-base) var(--ease); }
.detail.enter .detail-title, .detail.enter .detail-sub { animation: fade var(--t-base) var(--ease); }
.detail.enter .tab.on::after { animation: grow var(--t-base) var(--ease); }
.wtab.pop { animation: rise var(--t-base) var(--ease); }
.starbtn.pop svg { animation: pop .24s var(--ease); }
.scrim.enter { animation: fade var(--t-fast); }
.scrim.enter .dialog { animation: dialog var(--t-base) var(--ease); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(312.5%); } }
@keyframes dot { 0%, 60%, 100% { opacity: .35; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@keyframes grow { from { transform: scaleX(.4); opacity: 0; } }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: none; } }
@keyframes dialog { from { opacity: 0; transform: scale(.97); } }

:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---- agent: tree and tile grid ---- */
.tree { padding-top: 4px; }
.ws-row { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px 0 16px; cursor: pointer; }
.ws-row:hover, .chat-row:hover, .tree-dir:hover, .tree-file:hover, .tree-hit:hover { background: var(--raised); }
.ws-row .t-name { font-size: 15px; }
.ws-icon { color: var(--text-2); display: inline-grid; }
.ws-n { font-size: 13px; color: var(--text-3); }
.tree .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--behind); }
.tree .rowact { display: none; }
.ws-row:hover .rowact, .chat-row:hover .rowact, .menu-wrap:has(.menu) .rowact { display: inline-grid; }
.chat-row { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px 0 37px; border-left: 3px solid transparent; font-size: 14px; color: var(--text); cursor: pointer; }
.chat-row .when { flex: none; font-size: 13px; color: var(--text-3); }
.chat-row:hover .when { display: none; }
.chat-row.on { background: var(--raised); border-left-color: var(--accent); font-weight: 600; }
.chat-row:not(.open) { color: var(--text-2); }
.tree-empty { padding: 8px 16px 8px 40px; color: var(--text-3); font-size: 13px; font-style: italic; }
.detail:has(.grid-wrap) { background: var(--panel); }
.grid-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 12px; }
.restore { flex: none; align-self: flex-start; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--r-m); background: var(--base); border: 1px solid var(--line); color: var(--text); font-size: 14px; }
.tile-grid { flex: 1; min-height: 0; display: grid; gap: 12px; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows), minmax(0, 1fr)); }
.tile { position: relative; container-type: inline-size; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--base); border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; transition: border-color var(--t-fast); }
.tile:hover:not(.on) { border-color: var(--line-strong); }
.tile.attn { border-color: var(--changes); }
.tile.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tile .rowact { display: inline-grid; flex: none; }
.tile-head { flex: none; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px 0 8px; border-bottom: 1px solid var(--line-soft); }
.tile-head > .rowact { color: var(--text-3); }
.tile-head > .rowact:hover { color: var(--text); }
.tile-title { min-width: 0; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--text); }
.tile-state { flex: none; }
.ctx { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 2px 6px; border-radius: var(--r-s); color: var(--text-2); font-size: 13px; }
button.ctx:hover { background: var(--raised); }
.ring { flex: none; }
.tile-scroll { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 12px; display: flex; flex-direction: column; }
.tile-col { width: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.tile-col > * { flex: none; }
.msg { display: flex; align-items: flex-start; gap: 4px; min-width: 0; max-width: 100%; }
.msg.me { flex-direction: row-reverse; }
.msg-tools { flex: none; visibility: hidden; }
.msg:hover .msg-tools, .msg-tools:has(.menu) { visibility: visible; }
.msg .bubble { min-width: 0; max-width: min(760px, 100% - 34px); overflow-wrap: anywhere; font-size: 14px; line-height: 22px; }
.bubble.says { background: var(--panel); padding: 8px 12px; border-radius: var(--r-m); }
.bubble.says p { margin: 0 0 6px; }
.bubble code { font: 400 13px var(--mono); background: var(--well); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
.msg-meta { margin-top: 4px; text-align: right; font-size: 12px; color: var(--text-3); }
.fold { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; min-height: 26px; padding: 0 6px 0 2px; border-radius: var(--r-s); font-size: 13px; color: var(--text-2); }
.fold:hover { color: var(--text); background: var(--raised); }
.fold-n { font: 500 13px var(--mono); }
.think { font-size: 13px; line-height: 20px; color: var(--text-2); padding: 0 0 0 20px; font-style: italic; }
.tool { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tool-group { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tool-line { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; color: var(--text-2); }
.tool-chip { flex: none; font: 500 13px/20px var(--mono); padding: 0 6px; border-radius: 4px; background: var(--raised); color: var(--text); }
.tile .tool-chip { background: var(--well); }
.tool-st { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-3); }
.tool-st.bad, .tool-err { color: var(--danger); }
.tool-err { font-size: 13px; }
.mini-diff { margin: 2px 0 0; padding: 6px 8px; border-radius: var(--r-s); background: var(--well); font: 400 13px/19px var(--mono); overflow-x: auto; }
.mini-diff .add { color: var(--ok); }
.mini-diff .del { color: var(--danger); }
.card-kind { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--changes); }
.tile .perm, .tile .ask { max-width: min(640px, 100%); display: flex; flex-direction: column; gap: 6px; background: var(--panel); }
.perm-detail { color: var(--text-2); overflow-wrap: anywhere; }
.perm-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.ask-head { display: flex; align-items: center; gap: 8px; }
.ask .opts { margin-top: 2px; }
.btn.picked { border-color: var(--accent-ink); color: var(--accent-ink); }
.btn[disabled] { opacity: .5; cursor: default; }
/* a tile is already a card, so a plain button inside it steps up one more */
.tile .btn:not(.primary):not(.ghost) { background: var(--raised); }
.tile .btn:not(.primary):not(.ghost):hover { background: var(--overlay); }
.sysnote { align-self: center; font-size: 13px; color: var(--text-2); font-style: italic; text-align: center; }
.tile .queue { flex: none; padding: 8px 10px 0; display: flex; flex-direction: column; gap: 4px; }
.tile .queued { font-size: 14px; color: var(--text); background: var(--panel); }
.flyout { position: absolute; z-index: 5; top: 48px; right: 10px; width: min(300px, calc(100% - 20px)); max-height: calc(100% - 64px); overflow-y: auto; padding: 10px 12px; background: var(--overlay); border: 1px solid var(--line-strong); border-radius: var(--r-m); box-shadow: 0 10px 28px rgba(0, 0, 0, .4); }
.fly-head { display: flex; align-items: baseline; justify-content: space-between; }
.fly-title { font-size: 15px; font-weight: 600; color: var(--text); }
.fly-row { display: flex; align-items: flex-start; gap: 8px; min-height: 26px; padding: 3px 0; font-size: 14px; color: var(--text); }
.fly-row b { font-weight: 600; }
.tile-composer { flex: none; padding: 8px 10px 10px; border-top: 1px solid var(--line-soft); }
.tile-composer textarea { min-height: 40px; max-height: 120px; }
.tile-composer .pills { margin-top: 6px; }
.pills { display: flex; align-items: center; gap: 2px; margin-top: 4px; min-width: 0; }
.pills .menu-wrap { flex: 0 1 auto; min-width: 0; }
.pills .menu-wrap:has(.p-model) { flex: 0 2 auto; min-width: 56px; }
.pill-gap { flex: none; width: 6px; }
.pill-btn { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; min-width: 0; height: 28px; padding: 0 6px; border-radius: var(--r-s); font-size: 13px; color: var(--text); }
.pill-btn:hover:not([disabled]) { background: var(--raised); }
.pill-btn.locked { flex: none; color: var(--text-3); cursor: default; }
.pill-btn svg { flex: none; }
.rowact.lit { color: var(--changes); }
.rowact.dim { color: var(--text-3); }
.send { flex: none; width: 30px; height: 30px; padding: 0; margin-left: 4px; }
.menu.up { top: auto; bottom: 32px; }
@container (max-width: 560px) {
  .p-harness .p-word, .ctx-pct { display: none; }
  .pill-btn { padding: 0 4px; }
}
@container (max-width: 440px) {
  .tile-state:not(.need), .p-variant .p-word { display: none; }
}

/* ---- notes: folder tree and live editor ---- */
.tree-dir, .tree-file { display: flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px 0 calc(16px + var(--d) * 16px); font-size: 14px; cursor: pointer; color: var(--text); }
.tree-file { border-left: 3px solid transparent; padding-left: calc(13px + var(--d) * 16px + 20px); color: var(--text-2); }
.tree-file.on { background: var(--raised); border-left-color: var(--accent); color: var(--text); font-weight: 600; }
.tree-hit { padding: 8px 16px; cursor: pointer; font-size: 14px; border-left: 3px solid transparent; }
.tree-hit.on { background: var(--raised); border-left-color: var(--accent); }
.note-create { display: flex; flex-direction: column; gap: 6px; }
.dirty-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--changes); }
.unsaved { flex: none; font-size: 13px; color: var(--changes); }
.t-mono-title { font: 500 16px/24px var(--mono); color: var(--text); min-width: 0; }
.scope-chip { flex: none; padding: 1px 8px; border-radius: 10px; background: var(--raised); font-size: 13px; color: var(--text); }
.statusline { flex: none; display: flex; align-items: center; gap: 12px; min-height: 30px; padding: 0 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--text-2); }
.prose blockquote { margin: 0 0 12px; padding-left: 12px; border-left: 3px solid var(--line-strong); color: var(--text-2); }
.prose ol { margin: 0 0 12px; padding-left: 22px; }
.prose .tasks { list-style: none; padding-left: 0; }
.prose .tasks li { display: flex; align-items: center; gap: 8px; }
.prose .tasks .done { color: var(--text-2); text-decoration: line-through; }
.prose .check { flex: none; width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line-strong); }
.prose .check.on { background: var(--accent); border-color: var(--accent); }

/* the tree's rows are short and the grid wants the width */
.shell.tree-list .list { width: 320px; }

/* ---- notes: the folder tree beside one live editor ---- */

/* ---- dialogs: the only overlay ---- */

  const count = rows.filter(f => f.on).length;

      <div class="inline"><span class="t-meta">Depth</span><span class="stepper"><button class="btn icon" style="width:30px;height:30px" aria-label="Decrease scan depth" data-act="depth" data-arg="-1">${I('minus', 14)}</button><b>${d.depth}</b><button class="btn icon" style="width:30px;height:30px" aria-label="Increase scan depth" data-act="depth" data-arg="1">${I('plus', 14)}</button></span><span class="grow"></span><button class="btn" ${JOBS.scan ? 'disabled' : ''} data-act="doscan">${JOBS.scan ? spin() + 'Scanning…' : I('search', 16) + 'Scan'}</button></div></div>${list}`,
    `<button class="btn" data-act="close">Close</button><button class="btn primary" ${count ? '' : 'disabled'} data-act="addfound">Add${count ? ` ${count}` : ''}</button>`);

/* ---- dispatch ---- */
const simple = (title, map, fn) => listHead(title) + `<div class="list-scroll">${Object.entries(map).map(([id, v]) => fn(id, v)).join('')}</div>`;
function renderList() {
  const k = sec(); let html;
  if (k === 'repos') html = reposList();
  else if (k === 'summary') html = summaryList();
  else if (k === 'tools') html = simple('Tools', TOOLS, (id, t) => simpleRow(id, t[0], t[1]()));
  else if (k === 'settings') html = simple('Settings', SETTINGS[S.app], (id, t) => simpleRow(id, t[0], t[1]));
  else if (k === 'chats') html = chatsList();
  else html = notesList();
  $('list').innerHTML = html;
}
function renderDetail() {
  const k = sec();
  $('detail').innerHTML = { repos: repoDetail, summary: summaryDetail, tools: toolDetail, settings: settingsDetail, chats: chatDetail, notes: noteDetail }[k]();
}
const viewKey = () => [S.app, sec(), S.repo, S.tab, S.pr, sec() === 'chats' ? 'grid' : S.pick[pickKey()], S.active].join('|');
const SCROLLERS = ['#list .list-scroll', '#detail .detail-body', '#detail .ch-scroll', '#detail .diff-scroll'];
const FIELDS = '#detail textarea, #detail input, #layer input';
const fieldKey = el => el.id || el.getAttribute('aria-label');
let lastView = '';
/* a redraw keeps typing, focus and scroll: jobs finish while people are working */
function render() {
  const view = viewKey(), same = view === lastView, a = document.activeElement;
  if (!same) { S.issueQ = ''; S.menu = null; S.addingTag = false; S.listState = 'open'; S.commit = same ? S.commit : 0; }
  const fields = [...document.querySelectorAll(FIELDS)].filter(el => !el.dataset.set).map(el => [fieldKey(el), el.value]);
  const scrolls = SCROLLERS.map(s => document.querySelector(s)?.scrollTop ?? 0);
  const tileScrolls = Object.fromEntries([...document.querySelectorAll('.tile-scroll')].map(el => [el.dataset.tile, [el.scrollTop, el.scrollHeight - el.scrollTop - el.clientHeight < 8]]));
  const focus = a && a !== document.body ? { key: fieldKey(a), act: a.dataset?.act, arg: a.dataset?.arg, start: a.selectionStart, end: a.selectionEnd } : null;

  renderChrome(); renderStrip(); renderList(); renderDetail();
  $('layer').innerHTML = dialogHtml(); S.dlgFresh = false;
  $('shell').classList.toggle('wide-tab', (sec() === 'repos' && ['changes', 'history'].includes(S.tab)) || (sec() === 'chats' && S.tiles.length > 1));
  $('shell').classList.toggle('tree-list', S.app === 'agent');
  $('shell').classList.toggle('in-tab', sec() === 'repos' && !!S.active && !S.listOpen);

  /* only a new view plays the entrance */
  $('detail').classList.toggle('enter', !same);
  for (const el of document.querySelectorAll('.tile-scroll')) {
    const was = tileScrolls[el.dataset.tile];
    el.scrollTop = !was || was[1] ? el.scrollHeight : was[0];
  }
  noteStatus();
  const list = document.querySelector(SCROLLERS[0]);
  if (list) list.scrollTop = scrolls[0];
  if (same) {
    SCROLLERS.slice(1).forEach((s, i) => { const el = document.querySelector(s); if (el) el.scrollTop = scrolls[i + 1]; });
    if (!S.clearFields) for (const el of document.querySelectorAll(FIELDS)) {
      const kept = !el.dataset.set && fields.find(([k]) => k === fieldKey(el));
      if (kept) el.value = kept[1];
    }
  }
  if (focus) {
    const back = [...document.querySelectorAll('input, textarea, [data-act]')].find(el =>
      (focus.key && fieldKey(el) === focus.key) || (focus.act && el.dataset.act === focus.act && el.dataset.arg === focus.arg));
    back?.focus({ preventScroll: true });
    if (back && focus.start != null && 'selectionStart' in back && back.type !== 'password') back.setSelectionRange(focus.start, focus.end);
  }
  lastView = view; S.clearFields = false; S.popTab = null; S.popStar = null;
}

/* ---- actions ---- */
const fixFocus = () => { if (!S.tiles.includes(S.pick.chats)) S.pick.chats = S.tiles.at(-1) ?? null; };
const ACT = {
  app: a => { S.app = a; S.q = ''; S.searchOpen = false; },

  repo: n => {
    if (S.active && openTab(n)) { showView(n); return; }

    S.repo = n; S.file = 0; S.pr = null;
  },
  opentab: n => {
    const here = n === S.repo;
    if (!openTab(n)) { S.tabs.push({ repo: n, tab: here ? S.tab : 'overview', file: here ? S.file : 0, pr: here ? S.pr : null }); S.popTab = n; }
    showView(n);
  },
  openpr: no => { S.pr = +no; },

    const i = a.indexOf(':'), kind = a.slice(0, i), n = a.slice(i + 1), k = KINDS[kind];
    if (repoJobs(n).length) return false;
    startJob(`${kind}:${n}`, n, k.steps, () => {
      const r = REPOS.find(x => x.n === n), err = k.fail?.(r);
      if (err) { toast(err, 'error'); return false; }

  global: k => { const g = GLOBAL[k]; startJob(k, null, g.steps, () => { g.done?.(); toast(g.msg); }); },

  filter: f => { S.filter = f; const first = REPOS.find(r => (f === 'archive') === r.arch && (f !== 'attention' || needs(r)) && (f !== 'fav' || r.fav)); if (first && !S.active) S.repo = first.n; },

  snapit: () => { S.snapit = !S.snapit; toast(S.snapit ? 'SnapIt started' : 'SnapIt stopped', 'info'); },
  layout: id => { S.pick.layout = id; },
  resettpl: t => { TEMPLATES.find(x => x[0] === t)[1] = false; toast(`${t} template reset`, 'info'); },
  unqueue: a => { const [id, i, edit] = a.split(':'), [text] = S.queues[id].splice(+i, 1); if (edit) { const f = $(`composer-${id}`); if (f) f.value = text; } },
  steer: a => { const [id, i] = a.split(':'), [text] = S.queues[id].splice(+i, 1); (S.sent[id] ||= []).push(text); (S.notes[id] ||= []).push('Aborted the running turn and sent this next.'); },
  wstoggle: id => { const w = AGENT_SPACES.find(x => x.id === id), open = !(S.wsOpen[id] ?? w.open); S.wsOpen[id] = open; if (open) S.wsOn[id] = true; },
  rmws: id => { const w = AGENT_SPACES.findIndex(x => x.id === id), [gone] = AGENT_SPACES.splice(w, 1); S.tiles = S.tiles.filter(t => !gone.chats.includes(t)); fixFocus(); toast(`Removed ${gone.name}`, 'info'); },
  newchat: id => { const w = AGENT_SPACES.find(x => x.id === id), key = `c${++S.chatSeq}`; CHATS[key] = ['New chat', w.name, 'idle', 'now', 'opencode', 'glm-5.3-flash', 'max', 0, '0 tok', true]; w.chats.push(key); S.wsOpen[id] = true; S.wsOn[id] = true; S.tiles.push(key); S.pick.chats = key; S.restore = 0; },
  openchat: id => { if (!S.tiles.includes(id)) S.tiles.push(id); S.pick.chats = id; S.restore = 0; },
  focustile: id => { if (S.pick.chats === id) return false; S.pick.chats = id; },
  closetile: id => { S.tiles = S.tiles.filter(t => t !== id); S.fly[id] = false; fixFocus(); },
  pinchat: id => { S.pinned[id] = !S.pinned[id]; },
  delchat: id => { AGENT_SPACES.forEach(w => { w.chats = w.chats.filter(c => c !== id); }); S.tiles = S.tiles.filter(t => t !== id); delete CHATS[id]; fixFocus(); toast('Chat deleted', 'info'); },
  restore: () => { S.tiles = Object.keys(CHATS).slice(0, S.restore); S.restore = 0; S.pick.chats = S.tiles[0] ?? null; },
  ignorerestore: () => { S.restore = 0; },
  fold: k => { S.folds[k] = !S.folds[k]; },
  flyout: id => { S.fly[id] = !S.fly[id]; },
  tileflag: a => { const [k, id] = a.split(':'), map = k === 'allow' ? S.allow : S.mcp; map[id] = !(map[id] ?? true); },
  setpill: a => { const [id, k, v] = a.split('|'); (S.pills[id] ||= {})[k] = v; if (k === 'harness') CHATS[id][4] = v; },
  permit: a => { const [id, word] = a.split(':'); S.chatState[id] = word === 'Denied' ? 'idle' : 'run'; (S.notes[id] ||= []).push(`${word} the edit to src/palette.rs.`); },
  pickanswer: a => { const [id, o] = a.split(':'); S.answer[id] = o; },
  answer: id => { S.chatState[id] = 'run'; (S.sent[id] ||= []).push(S.answer[id]); },
  dismissq: id => { S.chatState[id] = 'idle'; },
  stopchat: id => { S.chatState[id] = 'idle'; (S.notes[id] ||= []).push('Stopped.'); },
  sendchat: id => {
    const f = $(`composer-${id}`), text = f?.value.trim();
    if (!text) return false;
    f.value = ''; S.clearFields = true;
    if (chatSt(id) === 'run') (S.queues[id] ||= []).push(text);
    else { (S.sent[id] ||= []).push(text); if (CHATS[id][9]) { CHATS[id][0] = text.slice(0, 40); CHATS[id][9] = false; } S.chatState[id] = 'run'; }
  },
  picknote: id => { S.pick.notes = id; S.noteNew = false; },
  notefolder: k => { const open = S.noteFolders[k]; S.noteFolders[k] = open === undefined ? !k.endsWith('warp-station') : !open; },
  collapsenotes: () => { const walk = (nodes, p) => nodes.forEach(n => { if (n.d) { S.noteFolders[`${p}/${n.d}`] = false; walk(n.kids, `${p}/${n.d}`); } }); walk(NOTE_TREE, S.noteScope || ''); },
  newnote: () => { S.noteNew = !S.noteNew; },
  createnote: () => {
    const name = $('note-name')?.value.trim(), folder = $('note-folder')?.value.trim() || 'warp-station';
    if (!name) return false;
    const key = `n${Object.keys(NOTES).length + 1}x`, file = name.endsWith('.md') ? name : `${name}.md`;
    NOTES[key] = [file, folder, '', 'now'];
    let dir = NOTE_TREE.find(n => n.d === folder); if (!dir) NOTE_TREE.push(dir = { d: folder, open: true, kids: [] });
    dir.kids.push(key); S.noteFolders[`/${folder}`] = true; NOTE_BODY[key] = `<h1>${esc(name)}</h1><p><br></p>`; S.pick.notes = key; S.noteNew = false;
  },
  savenote: () => { const id = S.pick.notes; if (!NOTES[id]) return; const b = $('note-body'); if (b) S.noteText[id] = b.innerHTML; S.noteDirty[id] = false; toast('Saved', 'info'); },
  delnote: id => { const drop = nodes => nodes.forEach(n => { if (n.kids) { n.kids = n.kids.filter(k => k !== id); drop(n.kids); } }); drop(NOTE_TREE); delete NOTES[id]; S.pick.notes = null; toast('Note deleted', 'info'); },
  notescope: v => { S.noteScope = v; },
  hitrepo: n => { S.searchOpen = false; S.sec.station = 'repos'; if (REPOS.find(r => r.n === n).arch) S.filter = 'archive'; ACT.repo(n); },
  hitnote: id => { S.searchOpen = false; S.q = ''; S.app = 'notes'; S.pick.notes = id; S.sec.notes = 'notes'; },
  hitcode: at => { S.searchOpen = false; toast(`Opened ${at} in VS Code`, 'info'); },
  dialog: k => {
    S.dlgFresh = true;
    S.dlg = k === 'clone' ? { kind: 'clone', url: '', dest: '~/Developments', name: '', err: '' } : { kind: 'add', dir: '~/Developments', depth: 2, found: null };
  },
  close: () => { S.dlg = null; },
  doclone: () => {
    const url = $('clone-url').value.trim(), dest = $('clone-dest').value.trim();
    const name = $('clone-name').value.trim() || (url.split('/').pop() || '').replace(/\.git$/, '');
    Object.assign(S.dlg, { url, dest, name });
    if (!url) { S.dlg.err = 'Enter a repository URL'; return; }
    if (!dest) { S.dlg.err = 'Destination folder does not exist'; return; }
    if (!name || /[\\/:*?"<>|]/.test(name)) { S.dlg.err = 'Enter a usable repository name'; return; }
    if (REPOS.some(r => r.n === name)) { S.dlg.err = 'Target folder already exists'; return; }
    S.dlg = null;
    startJob('clone', null, [['Cloning', 2200]], () => { REPOS.unshift(R(name, 'main', 0, 0, 0, 0, 0, 'now')); toast(`Cloned ${name}`); });
    JOBS.clone.name = name;
  },
  depth: d => { S.dlg.depth = Math.max(1, Math.min(6, S.dlg.depth + +d)); },
  doscan: () => {
    S.dlg.dir = $('scan-dir').value.trim(); S.dlg.found = null;
    startJob('scan', null, [['Scanning', 1400]], () => {
      if (S.dlg?.kind === 'add') S.dlg.found = [{ n: 'warp-station', known: true }, { n: '3d-desk-organizer', on: true }, { n: 'llm-wiki', on: true }, { n: 'remote-shutdown-server', on: false }];
      return false;
    });
  },
  togglefound: n => { const f = S.dlg.found.find(x => x.n === n); f.on = !f.on; },
  addfound: () => {
    const add = S.dlg.found.filter(f => f.on && !f.known);
    add.forEach(f => REPOS.push(R(f.n, 'main', 0, 0, 0, 0, 0, '1w')));
    S.dlg = null; toast(`Added ${add.length} ${add.length === 1 ? 'repository' : 'repositories'}`);
  },
};
function markDirty() { S.dirty = true; const b = $('save-settings'); if (b) b.disabled = false; }
document.addEventListener('click', e => {
  const inMenu = e.target.closest('.menu-wrap'), inSearch = e.target.closest('.titlebar .field');
  let redraw = false;
  if (S.menu && !inMenu) { S.menu = null; redraw = true; }
  if (S.searchOpen && !inSearch) { S.searchOpen = false; redraw = true; }
  const el = e.target.closest('[data-act]');
  if (!el) { if (S.armed) { S.armed = null; redraw = true; } if (redraw) render(); return; }
  if (el.dataset.stop) return;
  const act = el.dataset.act;
  if (act === 'close' && el.classList.contains('scrim') && e.target.closest('[data-stop]')) { if (redraw) render(); return; }
  const stayOpen = ['menu', 'arm', 'newbranch', 'createbranch'].includes(act) || el.closest('.branch-row')?.querySelector('.x') === el;
  if (act !== 'arm') S.armed = null;
  const result = ACT[act](el.dataset.arg);
  if (el.closest('.menu') && !stayOpen) S.menu = null;
  if (result !== false || redraw) render();
});
document.addEventListener('mousedown', e => {
  const b = e.target.closest?.('[data-fmt]');
  if (!b) return;
  e.preventDefault();
  const f = b.dataset.fmt, block = { h1: 'h1', h2: 'h2', h3: 'h3', quote: 'blockquote', pre: 'pre' }[f];
  if (block) document.execCommand('formatBlock', false, block);
  else if (f === 'ul') document.execCommand('insertUnorderedList');
  else if (f === 'ol') document.execCommand('insertOrderedList');
  else if (f === 'hr') document.execCommand('insertHorizontalRule');
  else if (['bold', 'italic', 'strikeThrough'].includes(f)) document.execCommand(f);
  $('note-body')?.dispatchEvent(new Event('input', { bubbles: true }));
});
document.addEventListener('selectionchange', () => { if (S.app === 'notes') noteStatus(); });
document.addEventListener('focusin', e => {
  if (e.target.id === 'search' && S.q && !S.searchOpen) { S.searchOpen = true; render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.set) { S.set[t.dataset.set] = t.value; markDirty(); return; }
  if (t.id === 'issue-filter') { S.issueQ = t.value; render(); }
  if (t.id === 'branch-filter') { S.branchQ = t.value; render(); }
  if (t.id === 'notes-q') { S.notesQ = t.value; render(); }
  if (t.id === 'ws-q') { S.wsQ = t.value; render(); }
  if (t.id === 'note-body') {
    const id = S.pick.notes; S.noteText[id] = t.innerHTML;
    if (!S.noteDirty[id]) {
      S.noteDirty[id] = true;
      document.querySelector('.detail-title .btn')?.insertAdjacentHTML('beforebegin', '<span class="unsaved">● unsaved</span>');
      document.querySelector('.tree-file.on')?.insertAdjacentHTML('beforeend', '<span class="dirty-dot" title="Unsaved"></span>');
    }
    noteStatus();
  }
  if (t.id === 'clone-url' && S.dlg) { S.dlg.url = t.value; const n = t.value.trim().split('/').pop().replace(/\.git$/, ''); const f = $('clone-name'); if (f && !S.dlg.nameTyped) f.value = n; }
  if (t.id === 'clone-name' && S.dlg) S.dlg.nameTyped = true;
  if (t.id === 'search') {
    S.q = t.value; S.searchOpen = true; S.searching = !!t.value.trim(); render();
    clearTimeout(S.searchTimer);
    S.searchTimer = setTimeout(() => { S.searching = false; render(); }, 280);
  }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Escape') {
    if (S.menu) { S.menu = null; render(); return; }
    if (S.searchOpen) { S.searchOpen = false; render(); return; }
    if (S.dlg) { S.dlg = null; render(); return; }
    if (t.id === 'issue-filter' && S.issueQ) { ACT.clearissues(); render(); return; }
    if (S.pr) { ACT.closepr(); render(); return; }
  }
  if (e.ctrlKey && e.key.toLowerCase() === 'k') { e.preventDefault(); ($('search') || $('ws-q') || $('notes-q'))?.focus(); }
  if (e.ctrlKey && e.key.toLowerCase() === 's' && S.app === 'notes') { e.preventDefault(); ACT.savenote(); render(); return; }
  if (e.key === 'Enter' && !e.shiftKey && t.id?.startsWith('composer-')) { e.preventDefault(); ACT.sendchat(t.id.slice(9)); render(); return; }
  if (e.key === 'Enter' && t.id === 'note-name') { ACT.createnote(); render(); return; }
  if (e.ctrlKey && e.key === '\\') { e.preventDefault(); ACT.focus(); render(); }
  if (e.ctrlKey && e.key === 'Enter' && sec() === 'repos' && !S.active) { e.preventDefault(); ACT.opentab(S.repo); render(); return; }
  if (e.key === 'Enter' && t.id === 'tag-input' && t.value.trim()) { cur().tags.push(t.value.trim()); S.addingTag = false; render(); return; }
  if (e.key === 'Enter' && t.id === 'new-branch') { ACT.createbranch(); render(); return; }
  if (e.key === 'Enter' && (t.classList?.contains('row') || t.classList?.contains('wtab') || t.classList?.contains('open') || t.classList?.contains('file') || t.classList?.contains('ws-row') || t.classList?.contains('chat-row') || t.classList?.contains('tree-file') || t.classList?.contains('tree-dir'))) t.click();
});
$('tabstrip').addEventListener('wheel', e => {
  e.preventDefault();
  $('tabstrip').scrollLeft += e.deltaY || e.deltaX;
}, { passive: false });
/* middle click: on a row opens a tab, on a tab closes it */
document.addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); });
document.addEventListener('auxclick', e => {
  if (e.button !== 1) return;
  const row = e.target.closest('[data-repo]'), tab = e.target.closest('[data-tab]');
  if (row) ACT.opentab(row.dataset.repo);
  else if (tab) ACT.closetab(tab.dataset.tab);
  else return;
  render();
});

document.documentElement.dataset.palette = load('palette', 'copper');
document.documentElement.dataset.type = load('type', 'inter');
const link = new URLSearchParams(location.hash.slice(1));
if (APPS[link.get('app')]) S.app = link.get('app');
if (link.get('sec')) S.sec[S.app] = link.get('sec');
if (link.get('pick')) S.pick[pickKey()] = link.get('pick');
if (link.get('tiles')) { S.tiles = link.get('tiles') === '0' ? [] : link.get('tiles').split(','); S.pick.chats = S.tiles[0] ?? null; }
if (link.get('restore')) S.restore = +link.get('restore');
if (link.get('scope')) S.noteScope = link.get('scope');
if (link.get('repo')) S.repo = link.get('repo');
if (link.get('tab')) S.tab = link.get('tab');
if (link.get('palette')) document.documentElement.dataset.palette = link.get('palette');
if (link.get('pr')) { S.pr = +link.get('pr'); S.tab = 'prs'; }
if (link.get('view')) ACT.opentab(link.get('view'));
render();
if (link.get('menu')) { S.menu = link.get('menu'); render(); }
</script>
</body>
</html>
