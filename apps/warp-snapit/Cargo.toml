[package]
name = "snapit"
version.workspace = true
edition.workspace = true
description = "SnapIt — Windows zone snapper (Rust port of Warp Station's Tools.SnapIt companion)"
license.workspace = true
publish = false

# the package is `snapit`; the artifact is `warp-snapit` (scripts/build.* reads
# the bin target through cargo metadata)
[[bin]]
name = "warp-snapit"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }
