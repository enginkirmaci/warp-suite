[package]
name = "warp-notes"
version = "0.1.0"
edition = "2024"
description = "WarpNotes — per-repo markdown notes with an Obsidian-style live editor"
license = "GPL-3.0"

[lib]
name = "warp_notes"
path = "src/lib.rs"

[[bin]]
name = "warp-notes"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# headless UI probes (tests/); feature-unifies with the normal gpui-kit dep
# only under `cargo test`
gpui-kit = { version = "0.7", features = ["test-support"] }

[dependencies]
# the shared component family (local sibling repos; swap to version deps to publish)
warpui-kit-core = { path = "../../kits/warpui-kit-core" }
warpui-kit-platform = { path = "../../kits/warpui-kit-platform" }
warpui-kit-markdown = { path = "../../kits/warpui-kit-markdown", features = ["mermaid", "all-languages"] }

# gpui-pre: crates.io snapshots of zed's gpui, pinned to the exact rev
# gpui-kit 0.7 is built against (=zed@1a28cff). Bump together with gpui-kit.
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["wayland", "x11"] }
gpui-kit = { version = "0.7" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
# debug-embed: embed assets at compile time in debug builds too — without it
# rust-embed resolves "assets" against the process CWD at runtime, so the app
# only finds its icons when launched from the repo root
rust-embed = { version = "8", features = ["debug-embed"] }
