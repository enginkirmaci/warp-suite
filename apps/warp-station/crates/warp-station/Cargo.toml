[package]
name = "warp-station"
version.workspace = true
edition.workspace = true
description = "Warp Station — repository workbench"
license.workspace = true
publish = false

# src/lib.rs is the probe boundary (tests/ build the real views); the binary is
# a thin bootstrap over it. Both targets come from cargo's defaults.

[dependencies]
# suite crates — the paths live in [workspace.dependencies]
warp-station-core = { workspace = true }
warpui-kit-core = { workspace = true }
warpui-kit-platform = { workspace = true }
warpui-kit-diff = { workspace = true, features = ["all-languages"] }
warpui-kit-markdown = { workspace = true }
warpui-kit-picker = { workspace = true }

# the gpui stack, pinned at the workspace root
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-kit = { workspace = true }

# third-party
anyhow = { workspace = true }
async-channel = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
# the Add-Repositories Browse… button; portal backend shares gpui's ashpd
# stack on Linux (no GTK dependency), IFileDialog on Windows
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# headless UI probes (tests/); feature-unifies with the normal gpui-kit dep
# only under `cargo test`
gpui-kit = { workspace = true, features = ["test-support"] }
# the warp watcher cycle test's throwaway endpoint dir
tempfile = { workspace = true }

[build-dependencies]
warpui-kit-build = { workspace = true }
