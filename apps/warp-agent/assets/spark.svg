<!--
	WarpAgent brand mark: main spark + companion.
	Geometry matches the in-app IconSpark (App.xaml) — same quad construction,
	control at ~24% of the radius along the diagonal (slim concave arms).
	The in-app glyph drops the companion so it stays legible at 12-15 DIP.
	Fill: white tips fading into neutral gray (vertical).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
	<defs>
		<linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#FFFFFF"/>
			<stop offset="0.3" stop-color="#C0C0C0"/>
			<stop offset="1" stop-color="#787878"/>
		</linearGradient>
	</defs>
	<path fill="url(#sparkFill)" d="M11 5 Q12.9 11.1 19 13 Q12.9 14.9 11 21 Q9.1 14.9 3 13 Q9.1 11.1 11 5 Z"/>
	<path fill="url(#sparkFill)" d="M18.1 1.8 Q19.05 4.75 22 5.7 Q19.05 6.65 18.1 9.6 Q17.15 6.65 14.2 5.7 Q17.15 4.75 18.1 1.8 Z"/>
</svg>
