[package]
name = "warp-agent"
version = "2.0.0"
edition = "2024"
description = "WarpAgent — a tile-grid chat client for opencode serve, rebuilt on GPUI"

[[bin]]
name = "warp-agent"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
# gpui-pre: crates.io snapshots of zed's gpui, pinned to the exact rev
# gpui-kit 0.7 is built against (=zed@1a28cff). Bump together with gpui-kit.
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["wayland", "x11"] }
# the shared component family (local sibling repos; swap to version deps to publish)
warpui-kit-core = { path = "../warp-suite/warpui-kits/warpui-kit-core" }
warpui-kit-diff = { path = "../warp-suite/warpui-kits/warpui-kit-diff", features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-yaml",
] }
warpui-kit-picker = { path = "../warp-suite/warpui-kits/warpui-kit-picker" }

gpui-kit = { version = "0.7", features = [
    # tree-sitter grammars for chat code-block highlighting
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
futures-util = "0.3"
# dsh web client: plain ws:// on loopback, no TLS features needed
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
smallvec = "1"
unicode-segmentation = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
anyhow = "1"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# debug-embed: embed assets at compile time in debug builds too — without it
# rust-embed resolves "assets" against the process CWD at runtime, so the app
# only finds its icons when launched from the repo root
rust-embed = { version = "8", features = ["debug-embed"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[dev-dependencies]
# headless selection probes (tests/selection_probe.rs); feature-unifies with
# the normal gpui-kit dep only under `cargo test`
gpui-kit = { version = "0.7", features = ["test-support"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

