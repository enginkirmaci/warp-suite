[package]
name = "warp-agent"
version.workspace = true
edition.workspace = true
description = "WarpAgent — a tile-grid chat client for opencode serve, rebuilt on GPUI"
license.workspace = true
publish = false

# Library plus a thin binary: the lib boundary lets headless probes open the
# real window; src/main.rs only carries the console attribute and calls run()
# (see AGENTS.md).

[dependencies]
# suite crates — the paths live in [workspace.dependencies]
warpui-kit-core = { workspace = true }
# all-languages also feeds the chat code-block grammars; a removed diff dep
# would take every tree-sitter grammar with it
warpui-kit-diff = { workspace = true, features = ["all-languages"] }
warpui-kit-markdown = { workspace = true, features = ["mermaid", "all-languages"] }
warpui-kit-picker = { workspace = true }
warpui-kit-platform = { workspace = true }

# the gpui stack, pinned at the workspace root
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-kit = { workspace = true }

# third-party
anyhow = { workspace = true }
async-channel = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
image = { workspace = true }
# the same parser gpui-base's TextView runs: the Markdown guard probes a text
# with it before that text reaches a TextView (a parser panic there would abort
# the render); keep the major in step with gpui-base's `markdown` requirement
markdown = "1"
reqwest = { workspace = true, features = ["query"] }
# debug-embed: embed assets at compile time in debug builds too — without it
# rust-embed resolves "assets" against the process CWD at runtime, so the app
# only finds its icons when launched from the repo root
rust-embed = { workspace = true, features = ["debug-embed"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smallvec = { workspace = true }
tokio = { workspace = true }
# dsh web client: plain ws:// on loopback, no TLS features needed
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
# headless chat probes (tests/*_probe.rs); feature-unifies with the normal
# gpui-kit dep only under `cargo test`
gpui-kit = { workspace = true, features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
# PR_SET_PDEATHSIG for the spawned serve/dsh children
libc = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }
