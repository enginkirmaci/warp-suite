# The warp-suite cargo workspace.
#
# Every app under apps/, every kit crate under kits/ and the Android bridge
# under android-apps/ is a member, so the suite resolves ONE dependency graph
# from ONE Cargo.lock and builds into one target dir (.cargo/config.toml). That
# is what lets a single gpui-pre compile serve all four desktop apps: cargo
# fingerprints a crate over its whole dependency
# graph, so separate workspaces that resolve different versions (or enable
# different features on a shared leaf) each paid for their own 228 MB copy.
#
# Before this, the four apps were four workspaces with four lockfiles that
# disagreed on 129 packages (addr2line 0.25.1 vs 0.27.1, ...). They are now
# unified here; the per-app Cargo.lock files are gone.
#
# Individual builds stay per-app: `cargo build -p warp-notes`, or from the app
# directory (cargo finds this workspace by walking up).
#
# resolver = "3" (edition 2024 semantics): dev-dependency features do NOT leak
# into normal builds, which is what keeps `test-support` out of release
# binaries even though every app lists it in [dev-dependencies].

[workspace]
resolver = "3"
members = [
    "kits/warpui-kit-build",
    "kits/warpui-kit-core",
    "kits/warpui-kit-diff",
    "kits/warpui-kit-markdown",
    "kits/warpui-kit-picker",
    "kits/warpui-kit-platform",
    "apps/warp-station/crates/warp-station",
    "apps/warp-station/crates/warp-station-core",
    "apps/warp-agent",
    "apps/warp-notes",
    "apps/warp-snapit",
    # The Android IME lives outside apps/ because the desktop release does not
    # build or ship it. Its bridge is a normal member so cargo and the CI gate
    # still compile and test it with the same lockfile.
    "android-apps/warp-android-scribe/bridge",
]

[workspace.package]
version = "0.1.9"
edition = "2024"
# Apps inherit GPL-3.0; every kit overrides this with "MIT" in its own
# manifest. The publishable kits inherit the suite URL the same way.
license = "GPL-3.0"
repository = "https://github.com/enginkirmaci/warp-suite"

# One owner for every dependency more than one member uses.
#
# A member writes `dep = { workspace = true }` and adds only the features it
# needs. Paths are relative to this file, so no member spells "../../kits/..."
# and the four-level station path exists once, here. The gpui stack must move
# together: `gpui`, `gpui_platform` and `gpui-kit` are one snapshot, so bump
# all three in one edit, or the workspace will not resolve.
[workspace.dependencies]
# the gpui stack: crates.io snapshots of zed's gpui, pinned to the exact rev
# gpui-kit 0.9 is built against
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["wayland", "x11"] }
gpui-kit = "0.9"

# the suite's own crates
warpui-kit-core = { path = "kits/warpui-kit-core" }
warpui-kit-build = { path = "kits/warpui-kit-build" }
warpui-kit-diff = { path = "kits/warpui-kit-diff" }
warpui-kit-markdown = { path = "kits/warpui-kit-markdown" }
warpui-kit-picker = { path = "kits/warpui-kit-picker" }
warpui-kit-platform = { path = "kits/warpui-kit-platform" }
warp-station-core = { path = "apps/warp-station/crates/warp-station-core" }

# third-party crates shared by two or more members
anyhow = "1"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rust-embed = "8"
serde = "1"
serde_json = "1"
smallvec = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "io-util", "sync"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-segmentation = "1"
winresource = "0.1"

# Dev/test profile: line tables only.
#
# Full debuginfo=2 across the ~950-crate graph put ~1 GB of DWARF into every
# app binary (warp-notes 1.03 GB, warp-station 1.06 GB) and dominated build
# time: this machine builds into .build/target on a QLC SATA SSD, so emission
# and linking are I/O-bound (measured 2026-11: swapping bfd for lld changed
# nothing, 2.8s vs 2.9s on the same link). line-tables-only keeps file:line
# in panic backtraces — including gpui frames — at a fraction of the bytes.
# [profile.test] inherits dev, so probes get the same treatment.
# Set debug = 2 here temporarily when a session needs gdb/lldb variable
# inspection; that rebuild only touches the dev fingerprints.
[profile.dev]
debug = "line-tables-only"

# One release profile for the whole suite (cargo reads these only from the
# workspace root; per-member [profile.*] tables are ignored).
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
