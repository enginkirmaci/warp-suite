name: kits

# The release workflow only runs on dispatch, so this is the only PR gate for
# the kit workspace. Keep fmt/clippy/tests green before a suite tag picks the
# crates up.

on:
  push:
    paths:
      - 'kits/**'
      - '.github/workflows/kits.yml'
  pull_request:
    paths:
      - 'kits/**'
      - '.github/workflows/kits.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kits
    steps:
      - uses: actions/checkout@v4

      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libvulkan-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kits/target
          key: ${{ runner.os }}-kits-${{ hashFiles('kits/**') }}
          restore-keys: |
            ${{ runner.os }}-kits-

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
