name: kits

# The kit workspace gate. Apps are built and tested in their own repositories;
# this workflow only knows kits/, the suite scripts and the pin table.
on:
  push:
    paths:
      - 'kits/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'suite.toml'
      - 'scripts/**'
      - '.cargo/**'
      - '.github/workflows/kits.yml'
  pull_request:
    paths:
      - 'kits/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'suite.toml'
      - 'scripts/**'
      - '.cargo/**'
      - '.github/workflows/kits.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kits-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # version.py check --history walks every commit back to the one that
          # added version.toml.
          fetch-depth: 0
      - name: Check manifest shape
        run: python3 scripts/meta/check-manifests.py
      - name: Read the pinned channel
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
        id: toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - name: Check the suite version
        run: python3 scripts/meta/version.py check --history
      - name: cargo fmt --check
        run: cargo fmt --all --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/gpui-deps

      - name: Read the pinned channel
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
        id: toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> .build/target
          shared-key: kits
          cache-on-failure: true

      - name: cargo clippy
        run: |
          cargo clippy --all-targets \
            -p warpui-kit-core -p warpui-kit-diff \
            -p warpui-kit-markdown -p warpui-kit-picker \
            -p warpui-kit-platform -p warpui-kit-build \
            -- -D warnings

      - name: cargo test
        run: |
          cargo test \
            -p warpui-kit-core -p warpui-kit-diff \
            -p warpui-kit-markdown -p warpui-kit-picker \
            -p warpui-kit-platform -p warpui-kit-build
