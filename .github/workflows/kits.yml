name: kits

# The kit workspace gate. The release workflow only runs on dispatch, so this
# is what keeps kits/ honest between suite tags.
#
# Two jobs on purpose: fmt is seconds and does not need a toolchain cache, so
# a formatting slip fails fast while clippy/tests warm their cache.

on:
  push:
    paths:
      - 'kits/**'
      - 'apps/**'
      - '.cargo/**'
      - '.github/workflows/kits.yml'
  pull_request:
    paths:
      - 'kits/**'
      - 'apps/**'
      - '.cargo/**'
      - '.github/workflows/kits.yml'
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per ref; a new push supersedes the queued one.
concurrency:
  group: kits-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debuginfo is most of a cargo target dir and none of what these probes
  # assert on: 9.5 GB -> 2.9 GB and 53s -> 39s on a cold build. Smaller cache,
  # faster restore, same test signal.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/gpui-deps

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # rust-cache keys on the rustc version, the lockfiles and
      # .cargo/config.toml, so a toolchain or dependency bump is a fresh key and
      # an unchanged one restores. The target dir is named explicitly because
      # kits/ builds into the suite target dir (.cargo/config.toml), not the
      # `kits/target` the action would assume by default - which is why the
      # hand-rolled actions/cache this replaced never restored anything.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> .build/target
          shared-key: kits
          cache-on-failure: true

      # kits/ is a member directory of the suite workspace (root Cargo.toml),
      # not a workspace of its own: select the kit crates by package.
      # -p selectors go BEFORE `--`: anything after it is passed to rustc.
      - name: cargo clippy
        run: |
          cargo clippy --locked --all-targets \
            -p warpui-kit-core -p warpui-kit-diff \
            -p warpui-kit-markdown -p warpui-kit-picker \
            -p warpui-kit-platform \
            -- -D warnings

      - name: cargo test
        run: |
          cargo test --locked \
            -p warpui-kit-core -p warpui-kit-diff \
            -p warpui-kit-markdown -p warpui-kit-picker \
            -p warpui-kit-platform

  # One workspace now covers kits + apps, so this job typechecks the app
  # crates against the kit crates as built - a renamed kit export or a feature
  # an app does not enable still fails here rather than at release time.
  # This is a typecheck + unit-test gate only: no release profile, no
  # packaging - the release workflow owns those.
  apps:
    runs-on: ubuntu-latest
    steps:
      # Full history on purpose: warp-station's changes_probe/git_parity probes
      # read this repository itself and assert on its commit log. With the
      # default fetch-depth 1 they see a single commit and fail.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/gpui-deps

      - uses: dtolnay/rust-toolchain@stable

      # ONE workspace and ONE lockfile, so a single cache entry covers every
      # app: the old "two anchor workspaces" split (listing apps/* separately
      # because each was its own workspace and rust-cache pruned per entry) is
      # gone with the per-app lockfiles.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> .build/target
          shared-key: apps
          cache-on-failure: true

      # warp-snapit is Windows-only (its engine is cfg(windows)-gated) but its
      # platform-neutral modules test on Linux; its package is `snapit`.
      # Every app is a member of the root workspace, so -p selects it.
      - name: Test apps
        run: |
          set -euo pipefail
          cargo test --locked \
            -p warp-station-core -p warp-station \
            -p warp-agent -p warp-notes -p snapit
