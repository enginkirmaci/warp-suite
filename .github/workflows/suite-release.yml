name: suite-release

# Assembles one combined suite release from the app releases pinned in
# suite.toml. It never builds an app: each app was built and published in its
# own repository at its pinned tag. The job downloads those assets, verifies
# their checksums, merges the Linux bundles and portable Windows zips into one
# Linux tarball and one Windows ZIP, and publishes the suite release.
#
# All app repositories are public; GITHUB_TOKEN is enough.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Suite version (suite.toml [suite].version); release tag v<version>'
        required: true

permissions:
  contents: write

concurrency:
  group: suite-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check the suite version and the tag
        run: |
          actual=$(python3 -c 'import tomllib; print(tomllib.load(open("suite.toml","rb"))["suite"]["version"])')
          test "$actual" = "${{ inputs.version }}" || {
            echo "::error::suite.toml says $actual, the dispatch says ${{ inputs.version }}"
            exit 1
          }
          test "$GITHUB_REF" = "refs/tags/v${{ inputs.version }}" || {
            echo "::error::dispatch the suite release with --ref v${{ inputs.version }}, not $GITHUB_REF"
            exit 1
          }

      - name: Download the pinned app releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for app in $(python3 scripts/meta/manifest.py list); do
            tag=$(python3 scripts/meta/manifest.py pin "$app" tag)
            repo=$(python3 scripts/meta/manifest.py pin "$app" repo)
            mkdir -p "artifacts/$app"
            echo "== $repo $tag"
            gh release download "$tag" --repo "$repo" \
              --pattern '*.tar.gz' \
              --pattern '*.zip' \
              --pattern 'SHA256SUMS' \
              --dir "artifacts/$app"
            (cd "artifacts/$app" && sha256sum -c SHA256SUMS --ignore-missing)
          done

      - name: Assemble the suite
        run: scripts/build/suite-assemble.sh --version "${{ inputs.version }}"

      - name: Refuse a second release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::release v${{ inputs.version }} already exists; bump suite.toml instead"
            exit 1
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: warp-suite v${{ inputs.version }}
          body: |
            One Linux tarball and one Windows ZIP, assembled from the app
            releases pinned in `suite.toml`; no app is rebuilt here.

            Linux: extract the tarball and run `bundle-install.sh`, or use
            `./install.sh --release` from this repository.

            Windows: extract `warp-suite-<version>-windows-x64.zip` and run
            `install.cmd`, or run the apps directly from the extracted
            `apps\` folder. The ZIP contains Warp Station, Warp Agent, Warp
            Notes and Warp SnapIt plus a Start Menu setup and uninstaller.

            `REVISIONS.txt` inside each package records the kit and app pins.
          files: |
            dist/linux/*.tar.gz
            dist/windows/*
            dist/SHA256SUMS
