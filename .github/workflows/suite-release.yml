name: suite-release

# Builds the apps in apps/ at this commit and publishes one combined GitHub
# Release. Deploy = dispatch this workflow with a version.
#
# Both jobs call the same scripts a local build uses - scripts/build.sh on
# Linux, scripts/build.ps1 on Windows - so CI cannot drift from a local build.
#
# Cache notes (why this is fast now):
#   - .cargo/config.toml redirects every workspace to .build/target, so the
#     cache must name that path explicitly (a bare `target` restores nothing).
#   - Swatinem/rust-cache keys on rustc + the lockfiles and prunes the target
#     dir down to dependencies before saving, so the entry stays small instead
#     of re-uploading the apps' own multi-GB artifacts on every run.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Suite version (release tag will be v<version>)'
        required: true
        default: '0.1.0'
      skip_windows:
        description: 'Build Linux only (skips the Windows installers)'
        type: boolean
        default: false

permissions:
  contents: write

# A release is never cancelled by a newer dispatch, but a queued one waits.
concurrency:
  group: suite-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/gpui-deps

      - name: Read the pinned channel
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
        id: toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # ONE workspace covers kits + all four apps (root Cargo.toml), so one
      # cache entry covers the whole graph and the pruning problem that forced
      # the old "two anchor workspaces" split is gone. The target dir is still
      # named explicitly: rust-cache would otherwise default to `<root>/target`,
      # which does not exist here, leaving a registry-only entry and a full
      # compile every run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> .build/target
          shared-key: release-linux
          cache-on-failure: true

      - name: Build Linux bundle
        run: scripts/build.sh --version "${{ inputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: warp-suite-linux
          path: dist/linux/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  windows:
    # warp-snapit is Windows-only and the .iss installers only build there, so
    # this job is what makes the release complete. skip_windows is for the
    # quick Linux-only iteration loop.
    if: ${{ !inputs.skip_windows }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Read the pinned channel
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
        id: toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # Same rule as the Linux job: one workspace, target dir named explicitly.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> .build/target
          shared-key: release-windows
          cache-on-failure: true

      # windows-latest normally ships Inno Setup; only install when absent.
      - name: Install Inno Setup
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows deliverables
        run: scripts/build.ps1 -Version "${{ inputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: warp-suite-windows
          path: |
            dist/windows/*.zip
            dist/windows/*.exe
            dist/windows/REVISIONS.txt
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [linux, windows]
    # Only publish when BOTH platforms built. `needs` alone would also skip this
    # job when windows is skipped, so the condition is explicit - and it
    # deliberately does NOT accept `skipped` or `cancelled`: skip_windows is a
    # Linux build check, and publishing from it would ship a Linux-only release
    # under the real version tag (that is how v0.1.2 briefly went out without
    # installers). `always()` also admits cancelled jobs, so exclude them.
    if: ${{ always() && !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: warp-suite v${{ inputs.version }}
          body: |
            Combined suite release built from this commit: ${{ github.sha }}.

            Linux: scripts/build.sh -> warp-suite-${{ inputs.version }}-linux.tar.gz.
            Extract and run bundle-install.sh, or use ./install.sh.

            Windows: scripts/build.ps1 -> per-app installers (Inno Setup) and
            portable zips. warp-snapit is Windows-only and ships portable only.

            Libraries: the kits/ workspace at this commit (warpui-kit-*), also
            recorded in each REVISIONS.txt.
          files: |
            artifacts/*.tar.gz
            artifacts/*.exe
            artifacts/*.zip
            artifacts/REVISIONS.txt
