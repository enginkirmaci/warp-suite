name: suite-release

# Builds the apps in apps/ at this commit and publishes one combined GitHub
# Release. Deploy = dispatch this workflow with a version.
#
# Both jobs call the same scripts a local build uses - scripts/build.sh on
# Linux, scripts/build.ps1 on Windows - so CI cannot drift from a local build.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Suite version (release tag will be v<version>)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config jq \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libvulkan-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and release artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/target/release
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/**/Cargo.lock', 'kits/**', 'apps.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('apps/**/Cargo.lock', 'kits/**') }}-
            ${{ runner.os }}-cargo-

      - name: Build Linux bundle
        run: scripts/build.sh --version "${{ inputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: warp-suite-linux
          path: dist/linux/*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and release artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/target/release
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/**/Cargo.lock', 'kits/**', 'apps.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('apps/**/Cargo.lock', 'kits/**') }}-
            ${{ runner.os }}-cargo-

      # windows-latest normally ships Inno Setup; only install when absent.
      - name: Install Inno Setup
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows deliverables
        run: scripts/build.ps1 -Version "${{ inputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: warp-suite-windows
          path: |
            dist/windows/*.zip
            dist/windows/*.exe
            dist/windows/REVISIONS.txt
          if-no-files-found: error

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: warp-suite v${{ inputs.version }}
          body: |
            Combined suite release built from this commit: ${{ github.sha }}.

            Linux: scripts/build.sh -> warp-suite-${{ inputs.version }}-linux.tar.gz.
            Extract and run bundle-install.sh, or use ./install.sh.

            Windows: scripts/build.ps1 -> per-app installers (Inno Setup) and
            portable zips. warp-snapit is Windows-only and ships portable only.

            Libraries: the kits/ workspace at this commit (warpui-kit-*), also
            recorded in each REVISIONS.txt.
          files: |
            artifacts/*.tar.gz
            artifacts/*.exe
            artifacts/*.zip
